const EVENTS=[{"title":"Exposición: \"Indumentaria tradicional del Oriente de Asturias","text":"Casa Municipal de Cultura de Llanes 11:00 - 13:00 y 17:30 - 20:00 h. Exposición: \"Indumentaria tradicional del Oriente de Asturias... Por la pinta son de Llanes\" (Llanes) La exposición de indumentaria tradicional titulada “Indumentaria tradicional del Oriente de Asturias… Por la pinta son de Llanes”. La misma, surge fruto de la colaboración entre la Asociación de Amigos de la Indumentaria Tradicional, la colección Javier Emperador y el Ayuntamiento de Llanes. La exposición cuenta con varios apartados sobre distintos tipos de indumentaria: trajes para el ramu, trajes de uso cotidiano, trajes de cristianar, trajes de labor, complementos y piezas de joyería, etc., así como material gráfico, fotografías en su mayor parte. La mayoría de las piezas en exposición son trajes de finales del s. XIX y comienzos del s. XX.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/por_la_pinta_son_de_llanes__0.jpg?itok=2tp8_wKW","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_indumentaria_0.jpg?itok=vf-6Mjy5"],"source":"https://www.llanes.es/../es/exposicion-indumentaria-tradicional-del-oriente-de-asturias-por-la-pinta-son-de-llanes-llanes-0"},{"title":"Exposición \"Retrato y Sociedad\" (Porrúa) Se prorroga la exposición de Daniel A","text":"Museo del Oriente de Asturias (Porrúa) 11:00 - 13:30 Horario de museo: Exposición \"Retrato y Sociedad\" (Porrúa) Se prorroga la exposición de Daniel A. Fervienza Permanecerá abierta hasta el 1 de noviembre Tras el cierre el pasado fin de semana –por razones técnicas al celebrarse el XXX Mercáu de Porrúa 2026- de la Exposición “Retrato y sociedad” en la obra fotográfica de Daniel Álvarez Fervienza, Llanes 1885 -1899. El Museo del Oriente de Asturias (Porrúa), hoy se reabre al público en el horario ordinario del mismo. La prórroga se extiende hasta el miércoles día 30 de setiembre, La exposición es la más visitada de la historia de nuestro Museo, ya sobrepasó los 5.500 visitantes. Nota de Prensa de 2 de abril de 2026 (Inauguración) Daniel Á. Fervienza (1857-1951), es una de las grandes figuras de la fotografía en Llanes de las dos últimas décadas del siglo XIX. Natural de Somiedo y formado en Madrid, trabajó como maestro y fotógrafo en Llanes durante 15 años, antes de tomar posesión - en el año 1899 - de la plaza de profesor de Ciencias en la Escuela Normal de Oviedo. La actividad fotográfica de Daniel Á. Fervienza nos ha legado placas fotográficas de gran valor, tanto desde la perspectiva documental como artística. El retrato fue uno de los principales activos de su obra fotográfica, actuando también como un singular reportero gráfico en acontecimientos sociales, fiestas, celebraciones y reuniones familiares. En sus galerías y en exteriores de Llanes y Cardosu posaron clientes de todos los sociales relacionadas con el concejo: pequeña burguesía, aristocracia, indianos, campesinos, educadores y eclesiásticos, entre otros, captando con gran maestría las distintas actitudes ante la cámara de las personas retratadas. En muchos aspectos entró en la modernidad de la fotografía. Su técnica, su composición y el buen uso de la luz en sus imágenes le hicieron acreedor de un lugar destacado en la historia de la fotografía de Llanes. La calidad de sus retratos permite el estudio en detalle de la indumentaria masculina y femenina, tanto del traje tradicional llanisco, como de la vestimenta popular y burguesa de la época. La exposición “Retrato y sociedad” de Daniel Á. Fervienza nos ofrece la oportunidad de apreciar una sorprendente calidad en una obra que se realiza en los inicios de la fotografía en Asturias. La exposición consta de 44 fotografias (tamaños 30 x40 cm y 40 x 50) de las que dos terceras partes son inéditas y una vitrina con elementos de gran interés, propiedad del fotógrafo: libros, fotografías de época, elementos de su laboratorio, libros sobre fotografías, agendas, un muestrario de cartones…etc. Abrió el acto del presidente de las Fundación titular del Museo del Oriente (Porrúa), José Luis Villaverde Amieva quien destacó “la importancia de esta exposición, que aporta nuevos documentos para la historia de la fotografía en Llanes y Asturias, hasta ahora desconocidos”. Anunció tambien que habrá “una segunda exposición sobre el retrato infantil para el ejercicio de 2027, con un catálogo que abarcará ambas, en donde la práctica totalidad de las fotografías serán inéditas”. Presentó al comisario Antonio Diego Llaca, llanisco, licenciado en Geografía e Historia, profesor de estas disciplinas y bisnieto del fotógrafo. Es el propietario del archivo de Daniel Á. Fervienza, que estuvo al cuidado de esta exposición en su totalidad: edición, impresión, y montaje de la totalidad de la misma. A continuación tomo la palabra el comisario de las exposición Antonio Diego Llaca, propietario del archivo de Daniel Á. Fervienza quien habló de “las técnicas fotográficas empleadas por el fotógrafo, durante el periodo de quince años a que se refiere la exposición” y de la “constante puesta al dia en las que iban surgiendo en unos momentos en que la evolución de la fotografía era muy dinámica, que se publicitaba como “Nueva Fotografía”. Por lo que se refiere al tema de contenidos se refirió a las características de los retratos expuestos, destacando los distintos tipos, los distintos entornos, ya interiores, ya exteriores, analizando el atrezzo de los diversos estudios en que trabajó y de manera singular “la preocupación por la composición de lo que podríamos llamar cuadros escénicos que son muchos de los retratos colectivos”. Remarcó que la labor fotográfica de Fervienza “no supuso menoscabo en la que fue su principal actividad, la labor pedagógica, como maestro” en Llanes y Cardosu. Finalmente se refirió al archivo fotográfico y su recuperación y aportación a la historia de la fotografía. Permanecerá abierta hasta el 22 de agosto (prorrogada hasta el 30 de septiembre, en horario de museo: Acceso gratuito. HORARIOS Del 18 de marzo al 30 de junio y del 9 de septiembre al 15 de diciembre (excepto puente): Martes a jueves, domingos y festivos: 11:00 a 13:30 h. Viernes y sábados: 11:00 a 13:30 h. y 17:00 a 19:00 h. Semana Santa De jueves a domingo: 11:00 a 13:30 h. y 17:00 a 20:00 h. Del 1 de julio al 8 de septiembre: De martes a domingo*: 11:00 a 13:30 h. y 17:00 a 20:00 h. *El segundo domingo de agosto cerramos por fiesta local.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_retrato_y_sociedad_porrua_1.jpg?itok=BT9KSInM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_porrua_1.jpg?itok=G7uZQCzU","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/presentacion_libro_porrua_0.jpg?itok=1WtwFun6"],"source":"https://www.llanes.es/../es/exposicion-retrato-y-sociedad-porrua"},{"title":"Exposición: \"Maestros de la pintura del s","text":"Casa Municipal de Cultura de Llanes (2ª Planta) 11:00 - 13:00 y 17:30 - 20:00 h. Exposición: \"Maestros de la pintura del s. XX en Asturias: Javier del Río y Pelayo Ortega” (Llanes) La Casa Municipal de Cultura de Llanes acoge una nueva exposición dedicada a Javier del Río y Pelayo Ortega, dos nombres fundamentales para acercarse a la pintura asturiana del siglo XX. A través de sus obras, la muestra nos invita a mirar por distintas ventanas: paisajes naturales y urbanos, lugares vividos, espacios íntimos y escenas donde la memoria, la emoción y la imaginación se mezclan. No se trata solo de contemplar lo representado, sino de entrar en una forma personal de mirar el mundo. Horario: de martes a sábado de 11:00 a 13:00 y de 17:30 a 20:00 horas","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_maestros_de_la_pintura.jpg?itok=G9BGu7-4"],"source":"https://www.llanes.es/../es/exposicion-maestros-de-la-pintura-del-s-xx-en-asturias
