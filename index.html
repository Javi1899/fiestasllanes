A TEATRALIZ","text":"Nueva de Llanes 12:00 Visita teatralizada a la Nueva Indiana (Nueva de Llanes) SÁBADO 3 de OCTUBRE a las 12:00; VISITA TEATRALIZADA A LA NUEVA INDIANA; (para asistir a esta actividad es imprescindible la inscripción previa). Os ofrecemos la posibilidad de asistir, de forma gratuita, a esta actividad en la que, de la mano de Mónica Balmori conoceremos Nueva de Llanes de una manera diferente a través de su patrimonio arquitectónico indiano, con el añadido de poder disfrutar con las paradas teatrales a cargo de Ana Morán y el músico David Varela, en distintos puntos de la localidad que permitirán al visitante sumergirse en la época en la que tantos nuevenses hicieron \"las américas\", contribuyendo a hacer el recorrido aún más ameno. Inscripciones: 985410106 / culturanueva@ayuntamientodellanes.com","days":[3],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_10_y_11_nueva.jpg?itok=kYMn1lYg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y"],"source":"https://www.llanes.es/../es/visita-teatralizada-la-nueva-indiana-nueva-de-llanes-11"},{"title":"exposición: \"Life Lately\" (Llanes) Exposición de Carleti López Traviesa, comisariada por Ainhoa Janices","text":"Casa Municipal de Cultura de Llanes (Planta Baja) 12:30 Inauguración de la exposición: \"Life Lately\" (Llanes) Exposición de Carleti López Traviesa, comisariada por Ainhoa Janices. Inauguración: sábado 3 de octubre de 2026 / 12:30 h. Conexión online con el artista desde México a las 13:00 h.","days":[3],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_life-lately_page-0001.jpg?itok=pk4cLwH_","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_life-lately_page-0001_0.jpg?itok=h0RaGx3B"],"source":"https://www.llanes.es/../es/inauguracion-de-la-exposicion-life-lately-llanes"},{"title":"jornada con la presentación \"Torcas y cuevas de la Peñe Villa y Llabres\", a cargo de Pablo Solares Villar","text":"Escuelas de Cortines (Caldueñu) 17:00 Charlas sobre espeleología en el valle de Caldueñu (Cortines) El sábado 3 de octubre, a las 17:00 h., las Escuelas de Cortines acogerán unas charlas sobre espeleología en el Valle de Caldueñu. Se iniciará la jornada con la presentación \"Torcas y cuevas de la Peñe Villa y Llabres\", a cargo de Pablo Solares Villar, y seguidamente la charla \"50 años de exploraciones espeleológicas en el valle Caldueñu\", a cargo de Carla Gutiérrez Meré y Pablo Gutiérrez Entrada libre hasta completar aforo.","days":[3],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/presentacion_libro_porrua_0.jpg?itok=1WtwFun6","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/charla_espeleo_3_octubre_cortines.jpg?itok=gdWelwH_","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_jornadas_de_cine_y_patrimonio.jpg?itok=pmnGd5EQ"],"source":"https://www.llanes.es/../es/charlas-sobre-espeleologia-en-el-valle-de-calduenu-cortines"},{"title":"Cine Documental de Llanes Segunda jornada de Falares en Llanes","text":"Casa Municipal de Cultura de Llanes 19:30 II FALARES. Muestra de Cine Documental de Llanes Segunda jornada de Falares en Llanes. El sábado podremos ver «MCA. La lucha eterna», dirigida por el asturiano Alejandro Nafría. La película reconstruye, a partir de testimonios de quienes participaron en él, la historia del Movimiento Comunista de Asturias, desde la clandestinidad antifranquista hasta su relación con los nuevos movimientos sociales. Un ejercicio de memoria sobre una parte de la historia política y social reciente de Asturias. Sábado 3 de octubre 19:30 h. Casa de Cultura de Llanes Entrada gratuita hasta completar aforo. Reserva tu entrada:","days":[3],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_muestra_de_cine_documental.jpg?itok=72T6jrGS","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_jornadas_de_cine_y_patrimonio.jpg?itok=pmnGd5EQ","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/falares_viernes_2.jpg?itok=s9Pq2ih5"],"source":"https://www.llanes.es/../es/ii-falares-muestra-de-cine-documental-de-llanes"},{"title":"Exposición: \"Life Lately\" (Llanes) Exposición de Carleti López Traviesa, comisariada por Ainhoa Janicesons","text":"Casa Municipal de Cultura de Llanes (Planta Baja) 11:00 - 13:00 y 17:30 - 20:00 h. Exposición: \"Life Lately\" (Llanes) Exposición de Carleti López Traviesa, comisariada por Ainhoa Janicesons. Carleti López Traviesa (Asturias, 1979). Artista multidisciplinar que lleva desde el 2011 enfocado en la pintura. Licenciado en Bellas Artes por la Universidad del País Vasco y Maestro en Artes Visuales por la Universidad Nacional Autónoma de México (UNAM). Es co-fundador de la galería Casa Equis y las ferias de arte FAIN y Clavo. Vive y trabaja entre la Ciudad de México y Asturias. La cultura callejera y la internet son referencias claves para mi trabajo. Utiliza el proceso pictórico como método de nexo entre la realidad y el mundo digital,elaborando un código iconográfico personal. México como su lugar de residencia durante 11 años seguidos ha tenido una enorme influencia en su producción artística. Actualmente está realizando un doctorado en artes visuales en la UNAM. Horario: de martes a sábado de 11:00 a 13:00 y de 17:30 a 20:00 horas","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_life-lately_page-0001.jpg?itok=pk4cLwH_","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_life-lately_page-0001_0.jpg?itok=h0RaGx3B"],"source":"https://www.llanes.es/../es/exposicion-life-lately-llanes"},{"title":"Conferencia: \"Palestina:","text":"Casa Municipal de Cultura de Llanes 19:00 Conferencia: \"Palestina: La existencia negada\" (Llanes) Con Teresa Aranguren Amézola. Escritora y Periodista especializada en Oriente Próximo y los Balcanes. Teresa Aranguren presenta Palestina: la existencia negada, publicado por Ediciones del Oriente y del Mediterráneo en 2025. La periodista y escritora, especializada desde hace décadas en Oriente Próximo, propone en este libro un recorrido por la historia reciente de Palestina y por los procesos políticos e históricos que, en su análisis, ayudan a entender el presente. El volumen parte del nacimiento del movimiento sionista a finales del siglo XIX y recorre episodios como la Declaración Balfour, la Nakba y la evolución del conflicto palestino-israelí. El encuentro en Llanes será una oportunidad para conversar con Teresa Aranguren sobre el libro, su experiencia profesional y las claves históricas que plantea para leer la situación actual. Jueves, 8 de octubre a las 19:00 h., en la Casa Municipal de Cultura de Llanes. Entrada gratuita hasta completar aforo. Reserva tu entrada:","days":[8],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/conferencia_palestina_0.jpg?itok=iZhxevve","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/conferencia_palestina.jpg?itok=Di5Zvcfe"],"source":"https://www.llanes.es/../es/conferencia-palestina-la-existencia-negada-llanes"},{"title":"Taller Infantil: \"Pulseras espanta-brujas\" (Llanes) Taller gratuito para crear pulseras trenzadas y decora","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:30 - 18:30 Taller Infantil: \"Pulseras espanta-brujas\" (Llanes) Taller gratuito para crear pulseras trenzadas y decorarlas con figuritas en 3D que brillan en la oscuridad. Edad: De 6 a 10 años. Viernes 9 de octubre - 17:30 a 18:30 h. Centro Cultural Infantil \"La Curuxa\" Reserva gratuita en Eventbrite:","days":[9],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/pulseras_espanta_brujas.jpg?itok=YLbNiyLL","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/muestra_cortos_infantiles.jpg?itok=hR1_nzNS","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_de_creacion_y_narracion_de_cuentos.jpg?itok=DgNLpmCY"],"source":"https://www.llanes.es/../es/taller-infantil-pulseras-espanta-brujas-llanes"},{"title":"seronda en llanes enantes que tengas sede","text":"Casa Municipal de Cultura de Llanes 19:00 Seronda en Llanes: \"Enantes que tengas sede\" Viernes 9, a las 19:00 h., en la Casa Municipal de Cultura de Llanes \"Enantes que tengas sede\". Sidra y poesía con Sofía Castañón y Miguel Llano. Entrada gratuita hasta completar aforo. Reserva tu entrada:","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cultura-llanes_2026-10-09_enantes-que-tengas-sede_page-0001.jpg?itok=bB1UbnyW","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/premio_florina_cambio_de_sede.jpg?itok=mZRz_hkp"],"source":"https://www.llanes.es/../es/seronda-en-llanes-enantes-que-tengas-sede"},{"title":"Cine Fórum: \"Air Doll\" (Nueva de Llanes) VIERNES 9 a las 19:00; CINE FÓRUM; Proyección de la película “A","text":"Casa Cultura del Valle de San Jorge (Nueva) 19:00 Cine Fórum: \"Air Doll\" (Nueva de Llanes) VIERNES 9 a las 19:00; CINE FÓRUM; Proyección de la película “Air Doll” (Hirokazu Koreeda, 2009, 116´). Una muñeca hinchable de tamaño natural vive en un modesto piso de Tokio. Es la única compañía de su solitario amo, un hombre de mediana edad. Él le habla, la baña y le hace el amor cada día cuando vuelve del trabajo. Sin embargo, esta rutina se rompe cuando, de repente, la Muñeca Hinchable cobra vida y con ella un alma. Acaba de nacer y no entiende lo que ocurre a su alrededor, aunque se da cuenta de que existe otro mundo más allá de las paredes del piso. Cuando, por fin, se atreve a salir al mundo exterior, se siente fascinada por todo lo que ve. Conoce a mucha gente, pero nadie es capaz de explicarle qué significa \"estar viva\". Un día, entra en un videoclub y conoce a Junichi, el vendedor, del que se enamora inmediatamente... Al terminar la proyección tendrá lugar un informal coloquio en el que los asistentes podrán expresar sus opiniones sobre la película.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/falares_viernes_2.jpg?itok=s9Pq2ih5","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg"],"source":"https://www.llanes.es/../es/cine-forum-air-doll-nueva-de-llanes"},{"title":"Taller de colocación de pañuelu (Nueva de Llanes) SÁBADO 10 a las 11:00 y a las 16:00: TALLER DE COLOCACIÓ","text":"Casa Cultura del Valle de San Jorge (Nueva) 11:00 y 16:00 h. Taller de colocación de pañuelu (Nueva de Llanes) SÁBADO 10 a las 11:00 y a las 16:00: TALLER DE COLOCACIÓN DE PAÑUELU. (para asistir a esta actividad es imprescindible la inscripción previa) Taller en el que aprenderás a colocar el pañuelo del traje de aldeana. En Llanes la forma de colocarlo se llama “repicar”, aunque hoy en día la frase más usada es “poner el pañuelu”. No se suele colocar por una misma, debiendo hacerlo otra persona.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva.jpg?itok=Bozh_icg"],"source":"https://www.llanes.es/../es/taller-de-colocacion-de-panuelu-nueva-de-llanes"},{"title":"Visita teatralizada a la Nueva Indiana (Nueva de Llanes) SÁBADO 10 y DOMINGO 11 a las 17:00; VISITA TEATRA","text":"Casa Cultura del Valle de San Jorge (Nueva) 17:00 Visita teatralizada a la Nueva Indiana (Nueva de Llanes) SÁBADO 10 y DOMINGO 11 a las 17:00; VISITA TEATRALIZADA A LA NUEVA INDIANA; (para asistir a esta actividad es imprescindible la inscripción previa). Os ofrecemos la posibilidad de asistir, de forma gratuita, a esta actividad en la que, de la mano de Mónica Balmori conoceremos Nueva de Llanes de una manera diferente a través de su patrimonio arquitectónico indiano, con el añadido de poder disfrutar con las paradas teatrales a cargo de Ana Morán y el músico David Varela, en distintos puntos de la localidad que permitirán al visitante sumergirse en la época en la que tantos nuevenses hicieron \"las américas\", contribuyendo a hacer el recorrido aún más ameno. Inscripciones: 985410106 / culturanueva@ayuntamientodellanes.com","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_10_y_11_nueva.jpg?itok=kYMn1lYg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y"],"source":"https://www.llanes.es/../es/visita-teatralizada-la-nueva-indiana-nueva-de-llanes-12"},{"title":"Taller Infantil: \"Las hadas de la pomarada\" (Llanes) \"Las Hadas de la pomarada\" de Elisabet Martín Teatro","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:30 - 18:30 Taller Infantil: \"Las hadas de la pomarada\" (Llanes) \"Las Hadas de la pomarada\" de Elisabet Martín Teatro. Taller gratuito sobre manzanos asturianos y cultura sidrera con marionetas de hadas de la pomarada. Edad: De 6 a 10 años. Sábado 10 de octubre - 17:30 a 18:30 h. Centro Cultural Infantil \"La Curuxa\" Reserva gratuita en Eventbrite:","days":[10],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/las_hadas_de_la_pomarada.jpg?itok=3TCVs5U8","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/festival_teatro_total.png?itok=1KLfUeMp","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/muestra_cortos_infantiles.jpg?itok=hR1_nzNS"],"source":"https://www.llanes.es/../es/taller-infantil-las-hadas-de-la-pomarada-llanes"},{"title":"Taller Infantil: \"Baba de hombre lobo\" (Llanes) Taller gratuito para experimentar con un slime blandito y","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 18:30 - 19:30 Taller Infantil: \"Baba de hombre lobo\" (Llanes) Taller gratuito para experimentar con un slime blandito y espumoso inspirado en la baba de hombre lobo. Edad: De 6 a 10 años. Sábado 10 de octubre - 18:30 a 19:30 h. Centro Cultural Infantil \"La Curuxa\" Reserva gratuita en Eventbrite:","days":[10],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/baba_de_hombre_lobo.jpg?itok=CL6pZPs6","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/muestra_cortos_infantiles.jpg?itok=hR1_nzNS","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_de_creacion_y_narracion_de_cuentos.jpg?itok=DgNLpmCY"],"source":"https://www.llanes.es/../es/taller-infantil-baba-de-hombre-lobo-llanes"},{"title":"concierto al aire libre contará también con la participación de Llau, trío formado por Dani Álvarez, Lisardo","text":"La Talá (Llanes) 21:30 \"Conciertu Resollu\" Banda Gaites Llacín y \"Llau\" La Banda Gaites Llacín presenta Resollu, su tercer trabajo discográfico, en la que la música tradicional asturiana se combina con nuevos sonidos. El concierto al aire libre contará también con la participación de Llau, trío formado por Dani Álvarez, Lisardo Prieto y Luis Nicolás. Sábado 10 de octubre, desde las 21:30 h. Lugar: La Talá (Llanes) Acceso libre Seronda en Llanes · Resollu + Llau La Banda Gaites Llacín presenta Resollu, el so tercer trabayu discográficu, nun conciertu al aire llibre na Talá. La nueche complétase con Llau, el tríu formáu por Dani Álvarez, Lisardo Prieto y Luis Nicolás, nacíu de sesiones d’improvisación alredor de la música tradicional. Sábadu 10 d’ochobre Dende les 21:30 h La Talá Accesu llibre","days":[10],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/conciertu_resollu_y_llau.jpg?itok=phH7ZJNv","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/resollu_0.jpg?itok=jwspqOBM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7"],"source":"https://www.llanes.es/../es/conciertu-resollu-banda-gaites-llacin-y-llau"},{"title":"Jornada \"Días de Sidra Llanes 2026\" Días de Sidra se celebra el domingo 11 de octubre en la carpa del prau","text":"Carpa situada en el prau del Sablón (Llanes) 11 Octubre 2026 Desde las 11:30 h. Jornada \"Días de Sidra Llanes 2026\" Días de Sidra se celebra el domingo 11 de octubre en la carpa del prau del Sablón. - 11:30 h. Desfile de gaitas con la BANDINA LOS TRAGOS. - 12:00 h. Apertura de la Carpa y Degustación de sidra casera y D.O.P. de Asturias. (Adquiere tu vaso por 5 € y disfruta de toda la sidra que quieras tomar). - 12:30 h. \"MASTER CLASS\" de escanciado impartido por la campeona LAURA OVIN. - 14:00 h. GRAN ACTUACIÓN de VICENTE DIAZ. - 18:00 h. ¡¡CASTAÑAS Y SIDRA del DUERNU para todos!! - 19:00 h. Bailes tradicionales interpretados por la agrupación local LA TAMARGA y acompañados de gaita y tambor por la BANDINA LOS TRASGOS. Con la participación de todos aquellos/as \"valientes\" que se animen a participar. - 20:00 h. Actuación de la agrupación local LA TAPADERA.","days":[11],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/dias_de_sidra_0.jpg?itok=_QEuHiB1","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/san_francisco_lledias_5.jpg?itok=hSa5bbbg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_jornadas_de_cine_y_patrimonio.jpg?itok=pmnGd5EQ"],"source":"https://www.llanes.es/../es/jornada-dias-de-sidra-llanes-2026"},{"title":"Concierto de Nando Agüeros (Fiesta de la Virgen de la Blanca) en Nueva Domingo 11 de octubre, a las 22:30 h","text":"Plaza Laverde Ruiz (Nueva de Llanes) 22:30 Concierto de Nando Agüeros (Fiesta de la Virgen de la Blanca) en Nueva Domingo 11 de octubre, a las 22:30 h. en Nueva de Llanes. Concierto de NANDO AGÜEROS – Gira XX Aniversario de «Viento del Norte». Además: Bar y comida desde las 20:00 h. Puestos, churrería, lotería, merchandising… Macro Bingo a las 00:15 h. Para finalizar DJ SUAREZZ desde las 00:30 hasta las 04:00 h. Y alguna sorpresa más… ¿Y si llueve? Tranquilos… MACROCARPA. Una noche diferente, una noche para reencontrarnos y, sobre todo, para volver a disfrutar. Con ocasión del concierto de Nando Agüeros en Nueva, se realizarán las siguientes descargas de pirotecnia: Domingo 11 de octubre: 19:00 h: 1/2 docena de voladores. 20:00 h: 1/2 docena de voladores. 21:00 h: 1/2 docena de voladores. 22:00 h: 1/2 docena de voladores. 00:15 h: traca de luz.","days":[11],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y"],"source":"https://www.llanes.es/../es/concierto-de-nando-agueros-fiesta-de-la-virgen-de-la-blanca-en-nueva"},{"title":"Feria del Pilar (Posada de Llanes)","text":"Parking del Furacu (por detrás de la Gasolinera Posada Menéndez) 12 Octubre 2026 Feria del Pilar (Posada de Llanes) El 12 de octubre Posada de Llanes celebra la Feria Ganadera del Pilar. Tendrá lugar en el parking de El Furacu, por detrás de la Gasolinera Posada Menéndez. POR LA MAÑANA Antes de las 11:30 h. Inscripciones participantes*. A las 12:00 h. XXI CONCURSO DE DESTREZA EQUINA - GYNKANA. POR LA TARDE A las 15:30 h. Inscripciones participantes*. A continuación XXII CARRERA DE CINTAS A CABALLO. Y para terminar CARRERA DE BURROS. *Para poder entrar en el recinto todos los animales deberán tener actualizada toda su documentación y seguros. C.E.A. RECINTO: ES33/036/0002108. **EN CASO DE QUE EL TIEMPO NO ACOMPAÑASE, ESTOS EVENTOS QUEDARAN SUSPENDIDOS Y SE REALIZARÁN OTRO DÍA. QUEDA TERMINANTEMENTE PROHIBIDO EL MALTRATO A LOS ANIMALES","days":[12],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_3.jpg?itok=9oxkrcOG","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_2_0.jpg?itok=LfpEV9Mj","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_en_posada_la_vieja.jpg?itok=Ho9q1hXo"],"source":"https://www.llanes.es/../es/feria-del-pilar-posada-de-llanes"},{"title":"Taller Infantil: \"Academia de detectives\" (Llanes) Vuelven las actividades del Centro cultural infantil de","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:30 Taller Infantil: \"Academia de detectives\" (Llanes) Vuelven las actividades del Centro cultural infantil de Llanes con talleres para crear, experimentar, imaginar y acercarnos a la cultura asturiana. Y este curso estrenamos una novedad: las inscripciones se harán a través de Eventbrite. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 6 a 10 años. Inscripción gratuita en Eventbrite: Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–21:30 Agenda de OCTUBRE Vie 9 · 17:30–18:30 — “Pulseras espanta-brujas” Vie 9 · 18:30–19:30 — “Baba de hombre lobo” Sáb 10 · 17:30 — “Las Hadas de la pomarada”, de Elisabet Martín Teatro Vie 16 · 17:30 — “Academia de detectives”, de Susana María Sela Vie 23 · 17:30–18:30 — “Atrezo de Halloween: diadema cuchillo” Vie 30 · 17:30–18:30 — “La mano de Miércoles” Vie 30 · 18:30–19:30 — “Huesos de zombi”","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_llanes.jpg?itok=m2xpMnob","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva.jpg?itok=Bozh_icg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva_0.jpg?itok=PUFeMWwg"],"source":"https://www.llanes.es/../es/taller-infantil-academia-de-detectives-llanes"},{"title":"Cine","text":"Casa Municipal de Cultura de Llanes 19:00 y 18:00 h. (solo el sabado) IV Mini Llanes de Cine La cuarta muestra de Cine Infantil y Juvenil de Llanes se celebrará los días 16 y 17 de octubre en la Casa Municipal de Cultura de Llanes. La programación combina largometrajes internacioales y una muestra de cortometrajes dirigidos a los más jóvenes, todo ello con entrada gratuita hasta completar aforo. Las entradas pueden reservarse de forma anticipada en: casaculturallanes.eventbrite.com Programación Viernes 16 de octubre - 19:00 h – \"Emilie y el secreto de las tormentas\", de Caroline Attia Lariviere. *Estreno Mundial. IV Mini Llanes de Cine. Emilie y el secreto de las tormentas (Le chant des orages), Caroline Attia, Francia, 2026, 26’, doblado al castellano. Emilie, una niña intrépida y sensible de ocho años, acaba de mudarse a la montaña con su familia. Su nuevo hogar se encuentra en un valle tranquilo y frondoso, pero últimamente parece que ocurre algo extraño durante las tormentas eléctricas, todos los animales del pueblo sufren y enferman. Emilie sospecha que esto tiene relación con los truenos y decide investigar el caso junto a Manon, su vecina, a quien le confiesa una habilidad secreta: las tormentas emiten una música que solo ella puede escuchar. Una aventura enigmática que despierta los sentidos y nos invita a reconectar con los lenguajes de la naturaleza y con aquello que nos hace diferentes, acompañada de cuatro historias para celebrar la diversidad, la aceptación y la alegría de encontrar el propio lugar en el mundo. Sábado 17 de octubre - 18:00 h – Sección de cortometrajes infantiles “El espíritu de la Navidad” de Jorge Tudanca. La noche antes de Navidad, un búho solitario y serio pasa las horas en silencio, marcado por una profunda ausencia. La aparición de una presencia inesperada lo llevará a enfrentarse a sus recuerdos y a redescubrir un espíritu que creía perdido. “Kronoshock” de Ignasi López Fàbregas. Enclavada enmedio de un recóndito valle y rodeada de verdes prados y ríos se alza abruptamente una imponente mole de nieve y roca.El aventurero lord Cliffrider tiene la esperanza de ser el primero en alcanzar la cumbre de esta anhelada montaña, pero a medida que el tiempo avanza esa ilusión se desvanece como el humo de su pipa. “La aventura pirata de Casa de Bruno” de Vega. Casa, un perro inquieto de 12 años, se lanza junto a sus dos mejores amigos a una peligrosa misión: conseguir la última copia de \"Pemole Zapato: El Videojuego\", un juego basado en su dibujo animado favorito. En su búsqueda, se adentrarán en un mercadillo oculto lleno de peligros, en donde los tres compis caninos deberán escapar de un trío de maleantes que quieren deshacerse de ellos. “Querida alma” de Clara Beltrán Concha Alma, una joven española, rescata del olvido el pueblo de su infancia a través de sus recuerdos. *Todos los cortometrajes son estrenos en Asrurias - 19:00 h – \"Robot salvaje\" de Chris Sanders. El épico viaje de un robot —la unidad 7134 de Roz,'Roz' para abreviar— que naufraga en una isla deshabitada y debe aprender a adaptarse al duro entorno, entablando gradualmente relaciones con los animales de la isla y convirtiéndose en madre adoptiva de un pequeño ganso huérfano. Información práctica Lugar: Casa Municipal de Cultura de LlanesEntrada gratuita (hasta completar aforo)Reserva de entradas: casaculturallanes.eventbrite.com Con esta iniciativa, Mini Llanes de Cine consolida su apuesta por acercar el séptimo arte a las familias y al público más joven, ofreciendo obras de gran calidad en un espacio accesible y participativo.","days":[16,17],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/mini_llanes_de_cine_16_oct.jpg?itok=SHSTURD8","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/mini_llanes_de_cine_robot_salvaje.jpg?itok=ioodWZvC","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_muestra_de_cine_documental.jpg?itok=72T6jrGS"],"source":"https://www.llanes.es/../es/iv-mini-llanes-de-cine"},{"title":"Concierto de los ganadores del II Premio Obdulia Álvarez \"La Busdonga\" de asturianada (Llanes) Premio Obdulia","text":"Casino de Llanes 19:30 Concierto de los ganadores del II Premio Obdulia Álvarez \"La Busdonga\" de asturianada (Llanes) Premio Obdulia Álvarez \"La Busdonga\" de asturianada Alicia Villanueva, Esteban Verdeja y Néstor Díaz, ganadores del II Premiu Obdulia Álvarez \"La Busdonga\" d’Asturianada, xúntense en Llanes nun conciertu dedicáu a la canción asturiana. Una ocasión pa escuchar en directu a tres de les voces premiaes na edición de 2025 y acercase a una de les formes más reconocibles de la tradición musical asturiana. Vienres 16 d’ochobre. 19:30 h. Casino de Llanes Entrada gratuita. Reserva en:","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/premios_obdulia.jpg?itok=j-KxqXs2","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_16_oct.jpg?itok=_IbRHKQ9"],"source":"https://www.llanes.es/../es/concierto-de-los-ganadores-del-ii-premio-obdulia-alvarez-la-busdonga-de-asturianada-llanes"},{"title":"Fiestas del Rosariu (Vibañu) SÁBADO 17 DE OCTUBRE 09:30 h","text":"Vibaño 17 Octubre 2026 - 18 Octubre 2026 Fiestas del Rosariu (Vibañu) SÁBADO 17 DE OCTUBRE 09:30 h. Salida a cortar la Joguera. 13:00 h. Sesión vermouht. 14:00 h. Comida para todos los vecinos de Vibañu y gente de la Joguera. (Ración de costillas y criollu: 8 €). 16:00 h. Bajada a hombros de la joguera desde lo altu del pueblu, hasta su lugar de plantación. 17:00 h. Hinchables para los más pequeños. 19:30 h. Espicha para todos los vecinos y sus allegados. 20:30 h. Ensayos de pandereta y de bailes regionales. 23:00 h. Comienza la verbena con Discomovil Vas Bailar. 00:00 h. Actuación de TEKILA Discomovil Vas Bailar. DOMINGO 18 DE OCTUBRE 12:00 h. Salida del ramu, seguida de misa solemne. 13:00 h. Bailes regionales y sesión vermouth. 18:00 h. Subasta del ramu, seguidu de bailes regionales. Horarios de las descargas de pirotecnia: Lunes 12 de octubre: 20:00 h: descarga de 1/2 docena de voladores. Martes 13 de octubre: 20:00 h: descarga de 1/2 docena de voladores. Miércoles 14 de octubre: 20:00 h: descarga de 1/2 docena de voladores. Jueves 15 de octubre: 20:00 h: descarga de 1/2 docena de voladores. Viernes 16 de octubre: 20:00 h: descarga de 1/2 docena de voladores. Sábado 17 de octubre: 10:00 h: descarga de 1/2 docena de voladores. 12:00 h: descarga de 1/2 docena de voladores. 16:00 h: descarga de 1/2 docena de voladores. 18:00 h: descarga de voladores. Domingo 18 de octubre: 12:00 h: descarga de voladores. 12:30 h: descarga de voladores. 13:00 h: descarga de voladores. 16:00 h: descarga de voladores. 18:00 h (remate del ramo): descarga de voladores.","days":[12,13,14,15,16,17,18],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_rosariu_vibanu_4.jpg?itok=d_O0W4WA","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_rosariu_ardisana_0.jpg?itok=tuvjA96K","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_rosariu_san_roque_0.jpg?itok=fkxsymjV"],"source":"https://www.llanes.es/../es/fiestas-del-rosariu-vibanu"},{"title":"Exposición: \"Fierro\" de Tania Blanco (Nueva de Llanes) SÁBADO 17 a las 19:00; INAUGURACIÓN EXPOSICIÓN (Escultu","text":"Casa Cultura del Valle de San Jorge (Nueva) 10:00 - 14:30 y 16:30 - 20:00. Sábados 10:30 - 13:30 h. Exposición: \"Fierro\" de Tania Blanco (Nueva de Llanes) SÁBADO 17 a las 19:00; INAUGURACIÓN EXPOSICIÓN (Escultura, fotografía, pintura) “Fierro” de Tania Blanco. (17/10 al 31/10) (Cultura en Rede) Fierro contempla la creación de una serie de obras que investigan los materiales de la periferia de la industria metalúrgica de Asturias. En concreto, las zonas portuarias más industrializadas, como es el Musel de Gijón, la ría de Avilés, así como toda la zona industrial intermedia entre las dos ciudades y el almacén de refractarios de Arcelor Mittal Sotiello. Lugares de interés por el tipo de residuo específico que existe en sus inmediaciones: el hierro / fierro. La artista se interesa por este material porque es un elemento químico metálico que además de ser una materia prima básica para el desarrollo industrial, está presente en la sangre de los mamíferos. Es el mineral que le da el color rojo a la sangre tal y como evidencia su etimología: del griego hema=sangre tita=mineral (piedra de sangre). En Asturias, la extracción y procesamiento de este elemento químico (el más abundante en la corteza terrestre y el más empleado en la industria) es el responsable de la existencia de una “arteria” hiperindrustrializada que modifica drásticamente el paisaje de la zona desde hace más de 70 años, entre las sedes de Arcelor Mittal de Avilés y Gijón. En este caso interesa el óxido que se escapa de la industria y que tiñe de rojo el paisaje de los alrededores. La mirada de Tania concibe este hierro como un elemento plástico, como un tinte, un elemento más que convive con el paisaje natural, de contrastes verdes y rojos. Retomando un tema constante en su obra, la artista se interesa también en los pequeños tesoros oxidados que podemos encontrar en estas zonas y que evidencian la entrada en una nueva era, el antropoceno, que se consolida y se hace visible en estos lugares en los que la línea entre el espacio natural y el industrial empieza a desvanecerse. La exposición podrá ser visitada durante el horario de apertura del centro: De martes a viernes de 10:00 a 14:30 y de 16:30 a 20:00 y sábados de 10:30 a 13:30","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva.jpg?itok=Bozh_icg"],"source":"https://www.llanes.es/../es/exposicion-fierro-de-tania-blanco-nueva-de-llanes"},{"title":"Alcuentru con Javier Martínez Concheso (Llanes) Premiu Florina Alías 2025 · L’home de choque","text":"Casa Municipal de Cultura de Llanes 19:00 Alcuentru con Javier Martínez Concheso (Llanes) Premiu Florina Alías 2025 · L’home de choque La Revolución d’Ochobre de 1934 vista por un escritor francés y recuperada agora n’asturianu. Javier Martínez Concheso presenta la so traducción de L’homme de choc, de Joseph Peyré, publicada orixinalmente en Francia en 1936. La versión asturiana, L’home de choque, recibió’l Premiu Florina Alías 2025 a la meyor traducción al asturianu. El xuráu destacó la naturalidá, la fluidez y la riqueza llingüística del trabayu. Sábadu 17 d’ochobre 19:00 h Casa Municipal de Cultura de Llanes (¡Cambiu de sede! La presentación va ser na Casa de Cultura, non na biblioteca). Entrada gratuita. Reserva la to plaza en: La traducción de L’Homme de choc, publicada por Ediciones Trabe y traducida por Javier Martínez Concheso, recibió nel 2025 el Premiu Florina Alías a la meyor traducción al asturianu. Javier Martínez Concheso (Sopelái, Llaviana, 1970) ye llicenciáu en Filoloxía Francesa pola Universidá d’Uviéu. Instaláu dende va años en Virazeil, ciudá de l’Aquitania francesa, ye caderalgu de Secundaria y da clases d’español y occitanu. Amás de participar en delles revistes lliteraries con traducciones d’autores franceses y occitanos, publicó llibros como Pequeña antoloxía de la poesía occitana (2010) o’l recién L’entierru en Sabres (traducción al asturianu del poema épicu de Bernat Manciet L’Enterrament a Sabres). Nel 2023 yá recibió esti mesmu premiu pola so traducción de Cándidu, o l’optimismu, de Voltaire, tamién publicáu pola editorial Trabe.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/premio_florina_cambio_de_sede.jpg?itok=mZRz_hkp"],"source":"https://www.llanes.es/../es/alcuentru-con-javier-martinez-concheso-llanes"},{"title":"Cine: \"El genio tranquilo\" (Lledías)","text":"Casa Concejo de Lledías 19:30 Cine: \"El genio tranquilo\" (Lledías) El genio tranquilo · Homenaje a Gonzalo Suárez Llanes rinde homenaje a Gonzalo Suárez con la proyección de El genio tranquilo y un coloquio posterior. Rodada en el Oriente de Asturias, la película vuelve sobre el territorio y sobre el universo cinematográfico del propio Suárez: playas, acantilados, cuevas, los Cubos de la Memoria o el ídolo de Peñatú entran en una historia en la que paisaje, memoria y cine se mezclan continuamente. Sábado 17 de octubre - 19:30 h. Casa Concejo de Lledías Entrada gratuita. Reserva en: Sinopsis Un relojero de Soweto fabrica una cámara rudimentaria con una caja de zapatos. Pronto descubre que su artilugio le permite ver el pasado y relacionarse con personajes de otros tiempos.A través de este curioso mediometraje que combina documental y fantasía, el director asturiano Gonzalo Suárez se autohomenajea y rinde tributo a las figuras cinematográficas que iluminaron su carrera. La obra de Suárez se enmarcó, durante los últimos años del franquismo, en la llamada Escuela de Barcelona del nuevo cine español, que se caracterizaba por romper con las doctrinas del cine de posguerra y de la dictadura con una visión más experimental y cosmopolita.''El genio tranquilo'' toma como punto de partida otra película de Gonzalo Suárez, ''Aoom'', rodada en 1970 y protagonizada por Lex Baker y Teresa Gimpera, que ya en su momento rompió esquemas y se convirtió en uno de los filmes más emblemáticos del director. Jugando con la distancia cronológica y la proximidad conceptual entre ambas cintas, el cineasta realza a sus mitos cinematográficos, como Orson Welles, Fritz Lang o Sam Peckimpah, y al actor Luis Ciges (''Patrimonio Nacional''), a quien dedica la obra. Ficha técnica Idioma: Español Duración: 75 min. País: España Año: 2006 Edad: +18 Género: Otras películas Director: Gonzalo Suárez Fotografía: Javier Blanco Guión: Gonzalo Suárez Música: Carles Cases Actores (Reparto): Ayanta Barilli, Pepín El Nuestru, Manuel Medina, Aitana Sánchez-Gijón Producción: Consorcio para el Desarrollo Rural del Oriente de Asturias","days":[17],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_genio_tranquilo-451249005-large.jpg?itok=Kef2D2ff","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/san_francisco_lledias_5.jpg?itok=hSa5bbbg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_muestra_de_cine_documental.jpg?itok=72T6jrGS"],"source":"https://www.llanes.es/../es/cine-el-genio-tranquilo-lledias"},{"title":"Concierto: \"Dinosaurio Meteorito\" (Llanes) Dinosaurio Meteorito · Por si no me encuentro al volver Dinosaurio","text":"Casino de Llanes 19:30 Concierto: \"Dinosaurio Meteorito\" (Llanes) Dinosaurio Meteorito · Por si no me encuentro al volver Dinosaurio Meteorito llega al Casino de Llanes con su primer EP, publicado en 2026. Edu, Lukas, Mangel, Espi y Anteo se mueven entre el indie-rock, las guitarras directas y melodías pensadas para funcionar con la misma fuerza en disco y en directo. Canciones sobre la vida adulta, las relaciones, la ansiedad, la autoestima y la búsqueda de un lugar propio, en un directo cercano, ruidoso y sin demasiados rodeos. Sábado 17 de octubre 19:30 h. Casino de Llanes Entrada gratuita. Reserva en:","days":[17],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/dinosaurio_meteorito.jpg?itok=0qLGoyHi","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_16_oct.jpg?itok=_IbRHKQ9"],"source":"https://www.llanes.es/../es/concierto-dinosaurio-meteorito-llanes"},{"title":"4a marcha carrera solidaria y 2o vermu torero astur la tribu llanes","text":"Llanes 18 Octubre 2026 A partir de las 12:00 h., frente al Ayto. de Llanes 4ª Marcha / Carrera Solidaria y 2º Vermú Torero-Astur \"La Tribu\" (Llanes) 4ª Marcha / Carrera Solidaria de La Tribu. Día Mundial Contra el Cáncer de Mama. El domingo 18 de octubre, a partir de las 12:00 h., frente al Ayto. de Llanes. Recorreremos llanes en familia, con amigos, solos; charlando, riendo, pensando... corriendo, ¡o paseando! Una MAREA DE MUYERINAS para visibilizar la enfermedad y recaudar fondos para su investigación y la asociación. Toda la info en: / ¡COLABORA COMPRANDO TU CAMISETA! A la venta en: Peluqueria Pelayo y Blanca (Llanes), Confeti (Llanes) y en la caseta situada en El Puente. 2º Vermú Torero-Astur* La Tribu, a partir de las 14:00 h. en Plaza Garelli. *Incluye aperitivo, bebida NO incluida. Tickets a 12 €, también están a la venta en los mismos sitios. ORGANIZA: Asociación de afectados/as de Cáncer de Mama y/o Ginecológico de Llanes","days":[18],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/4_carrera_solidaria_la_tribu.png?itok=pdoaDC3K","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/2o_vermu_solidario_la_tribu.png?itok=rX9VC5qK","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/la_tribu_0.jpg?itok=LOPs08py"],"source":"https://www.llanes.es/../es/4a-marcha-carrera-solidaria-y-2o-vermu-torero-astur-la-tribu-llanes"},{"title":"xi enduro villa de llanes posada de llanes","text":"Posada de Llanes 18 Octubre 2026 XI Enduro \"Villa de Llanes\" (Posada de Llanes) La XI edición del Enduro \"Villa de Llanes\" se celebra el domingo, 18 de octubre, en Posada de Llanes, organizado por el Moto Club Llanes con el apoyo de la Federación de Motociclismo del Principado de Asturias. La prueba, que cuenta ya con un centenar de inscritos, tendrá su salida a las 9:00 h en la plaza de Parres Piñera, finalizando hacia las 14:00 h. La entrega de trofeos tendrá lugar a las 15:00 h. INSCRIPCIONES WWW.FMPA.ES","days":[18],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_3.jpg?itok=9oxkrcOG","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_2_0.jpg?itok=LfpEV9Mj","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/xi_enduro.png?itok=bZUAMkmx"],"source":"https://www.llanes.es/../es/xi-enduro-villa-de-llanes-posada-de-llanes"},{"title":"xviii torneo de bolos concejo de llanes la venta puente nuevo","text":"Bolera de La Venta 16:00 Las semifinales y finales se disputarán los días 24 y 25 de octubre XVIII Torneo de Bolos \"Concejo de Llanes\" (La Venta - Puente Nuevo) Individual de cuatreada, con categorías absolutas y femenina. El torneo se desarrolla en la bolera de La Venta, a partir de las 16:00 h. Las tiradas clasificatorias tendrán lugar entre el 17 y el 23 de octubre, y las semifinales y finales se disputarán los días 24 y 25 de octubre. Premios Cat. Absoluta 1º 500€ y Trofeo 2º 350€ y Trofeo 3º 200€ y Trofeo 4º 150€ y Trofeo 5º a 8º 50€ Premios Cat. Femenina 1º 200€ y Trofeo 2º 100€ y Trofeo 3º 70€ y Trofeo 4º 50€ y Trofeo","days":[23,25],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/torneo_de_bolos_concejo_de_llanes.jpg?itok=FuobuMdh","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ej_cartel_nuevo.jpg?itok=PYG8Ha0j"],"source":"https://www.llanes.es/../es/xviii-torneo-de-bolos-concejo-de-llanes-la-venta-puente-nuevo"},{"title":"Cine Club de Llanes: \"El extraño\" (Llanes) Cineclub de Llanes ·","text":"Casa Municipal de Cultura de Llanes 19:00 Cine Club de Llanes: \"El extraño\" (Llanes) Cineclub de Llanes · El extraño El Cineclub de Llanes proyecta El extraño (Goksung), de Na Hong-jin, uno de los títulos más reconocidos del thriller y el terror surcoreano de la última década. En una pequeña localidad rural comienzan a sucederse muertes violentas al tiempo que se extiende una extraña enfermedad. Investigación policial, terror, superstición y relato sobrenatural se mezclan en una película que juega constantemente con la duda. Miércoles 21 de octubre - 19:00 h Casa Municipal de Cultura de Llanes Entrada gratuita. Reserva en: Título original: Goksung (The Wailing)aka Año: 2016 Duración: 156 min. País: Corea del Sur Dirección: Na Hong-jin Sinopsis: La vida de un pueblo coreano se ve alterada por una serie de asesinatos, salvajes y misteriosos, que azota a la pequeña comunidad rural. Los rumores y las supersticiones se propagan a causa de la presencia, desde hace poco tiempo, de un anciano extranjero que vive como un ermitaño. Ante la incompetencia de la policía para encontrar al asesino y sin tener una explicación racional, algunos habitantes del pueblo buscan a un chamán. Jong-Gu, un policía cuya familia está directamente amenazada, también cree que se trata de crímenes sobrenaturales","days":[21],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_club_21_oct.jpg?itok=zxWhqDlF","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_muestra_de_cine_documental.jpg?itok=72T6jrGS","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y"],"source":"https://www.llanes.es/../es/cine-club-de-llanes-el-extrano-llanes"},{"title":"Cara A y Cara B - Llanes en Danza (Llanes) Cara A y Cara B, de Adrián Gómez, fue la obra ganadora del Prim","text":"Patio de la Casa Municipal de Cultura de Llanes 19:30 Cara A y Cara B - Llanes en Danza (Llanes) Cara A y Cara B, de Adrián Gómez, fue la obra ganadora del Primer Premio de Coreografía en el XXXIV Certamen de Coreografía de Danza Española y Flamenco de Madrid. Interpretada por Adrián Gómez y Lucía Fernández, la pieza combina danza española y contemporánea para abordar desde el cuerpo la realidad de la ELA y cuestiones como la memoria, la pérdida, la fragilidad y los cuidados. Tras la representación habrá un encuentro con el público. Jueves 22 de octubre - 19:30 h. Patio de la Casa de Cultura de Llanes. En caso de lluvia, EMMLLA (Escuela Municipal de Música de Llanes). Entrada gratuita. Reserva en:","days":[22],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cara_a_y_cara_b.jpg?itok=BgjTKjZ_","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/caravana_de_poetas.jpg?itok=qeYAthp1","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/caravana_de_poetas1.jpg?itok=kd0Rw6kL"],"source":"https://www.llanes.es/../es/cara-y-cara-b-llanes-en-danza-llanes"},{"title":"Taller Infantil: “Atrezo de Halloween: diadema cuchillo” (Llanes) Vuelven las actividades del Centro cultu","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:30 - 18:30 Taller Infantil: “Atrezo de Halloween: diadema cuchillo” (Llanes) Vuelven las actividades del Centro cultural infantil de Llanes con talleres para crear, experimentar, imaginar y acercarnos a la cultura asturiana. Y este curso estrenamos una novedad: las inscripciones se harán a través de Eventbrite. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 6 a 10 años. Inscripción gratuita en Eventbrite: Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–21:30 Agenda de OCTUBRE Vie 9 · 17:30–18:30 — “Pulseras espanta-brujas” Vie 9 · 18:30–19:30 — “Baba de hombre lobo” Sáb 10 · 17:30 — “Las Hadas de la pomarada”, de Elisabet Martín Teatro Vie 16 · 17:30 — “Academia de detectives”, de Susana María Sela Vie 23 · 17:30–18:30 — “Atrezo de Halloween: diadema cuchillo” Vie 30 · 17:30–18:30 — “La mano de Miércoles” Vie 30 · 18:30–19:30 — “Huesos de zombi”","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/atrezo_de_halloween.jpg?itok=U8wmwrjb","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cultura-llanes_2026-10-09_enantes-que-tengas-sede_page-0001.jpg?itok=bB1UbnyW","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_llanes.jpg?itok=m2xpMnob"],"source":"https://www.llanes.es/../es/taller-infantil-atrezo-de-halloween-diadema-cuchillo-llanes"},{"title":"Concierto: \"Milana Bonita\"","text":"Casino de Llanes 19:30 Concierto: \"Milana Bonita\". III Noches del Casino de Llanes Viernes 23 de octubre, a las 19:30 h.: \"MILANA BONITA\". Indie Rock ENTRADAS ONLINE GRATUITAS, PREVIA RESERVA EN: Milana Bonita es una banda de rock originaria de Gijón, formada en 2020 por Ana Belén León, Diego Fernández e Isaac Alonso. En directo, la formación se completa con Alejandro Viña, David Rodríguez y Sergio Guerre, configurando una propuesta de seis músicos sobre el escenario que destaca por su potencia, personalidad y capacidad de conectar con el público. La banda ha desarrollado una identidad propia en la que conviven influencias del rock y la música clásica, dando forma a un sonido reconocible que combina melodías directas, guitarras atmosféricas y letras que exploran la memoria, las emociones y las historias cotidianas. Tras la publicación de los sencillos Busco Editorial, Y tú aquí y Ave Tropical, Milana Bonita participó en la serie de Netflix Última Noche en Tremor, donde interpretó dos de sus canciones. Posteriormente, la banda publicó su primer álbum homónimo, producido entre Asturias y Madrid por Mara Rubio y Kela Martínez para MK Music y presentado oficialmente en la Navidad de 2025. El trabajo cuenta con la colaboración de músicos de reconocido prestigio como Coki Giménez y Miguel Herrero, además de la participación de Pablo Senator en Humo, una de las canciones más representativas de la banda y una colaboración que contribuyó a ampliar su proyección dentro de la escena musical independiente. Más allá de sus grabaciones, Milana Bonita ha conseguido consolidar una propuesta escénica propia gracias a la energía, actitud y contundencia de sus actuaciones en directo. Su crecimiento sobre los escenarios y la solidez de su formación han convertido al grupo en una de las propuestas emergentes con mayor proyección dentro del panorama musical asturiano. En 2026, la banda se alzó con el primer premio del concurso Gijón Rock, uno de los certámenes musicales de referencia de la ciudad, un reconocimiento que les permitirá formar parte de la programación de la Semana Grande de Gijón. A este logro se suma su clasificación para la final de FestiAMAS, que se celebrará durante las fiestas de San Mateo, reafirmando el excelente momento artístico que atraviesa la formación. Actualmente, Milana Bonita continúa presentando su música en directo y trabajando en nuevos proyectos, manteniendo una apuesta firme por las canciones, la personalidad artística y una conexión honesta con el público.","days":[23],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/milana_bonita.jpg?itok=ILJmrIDA","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_meninas_en_el_casino.jpg?itok=z8-p0w9U","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7"],"source":"https://www.llanes.es/../es/concierto-milana-bonita-iii-noches-del-casino-de-llanes"},{"title":"Visita de la Familia Real a Llanes – Premio al Pueblo Ejemplar de Asturias 2026","text":"Llanes 24 Octubre 2026 A partir de las 12:00 h. Visita de la Familia Real a Llanes – Premio al Pueblo Ejemplar de Asturias 2026 El municipio de Llanes se prepara para vivir una jornada histórica con la visita de Sus Majestades los Reyes y Sus Altezas Reales la Princesa de Asturias y la Infanta doña Sofía, quienes presidirán los actos organizados con motivo de la concesión del Premio al Pueblo Ejemplar de Asturias 2026 a la Cofradía de Pescadores Santa Ana. Programa oficial de la jornada 12:00 h. Llegada de la Familia Real a las inmediaciones de la playa del Sablón. Tras el recibimiento institucional por parte de las autoridades locales y regionales, así como de la junta directiva de la Cofradía, la comitiva se trasladará a la plaza de Cristo Rey. 12:10 h. En la plaza de Cristo Rey, la Familia Real contemplará la devoción, tradición y folclore de los tres bandos de la villa (Magdalena, San Roque y Guía), con una muestra del tradicional baile de \"El Pericote\", danza representativa del concejo declarada de alto valor simbólico e identitario. Posteriormente, la comitiva se dirigirá a la plaza de Santa Ana. Descubrimiento de la placa conmemorativa y visita a la Capilla de Santa Ana. Se procederá al descubrimiento de la placa conmemorativa ante la fachada de la capilla de Santa Ana, patrona de los marineros de Llanes. En el interior del templo, la Familia Real será recibida por el párroco, Florentino Hoyos, quien realizará una breve explicación sobre el origen del templo y la advocación de su patrona. A continuación, un grupo de mujeres vestidas de marineras interpretará el cántico de alabanza a la Santa, acompañadas con panderetas tradicionales. Plaza de Santa Ana. La Familia Real presenciará la tradicional Danza Prima de Santa Ana, interpretada por un grupo de personas vestidas de marineras, y se detendrá ante un grupo de artesanas locales en la calle Ángel de la Moría, donde se explicará la elaboración artesanal de los trajes de aldeana y porruano llaniscos, declarados Bien de Interés Cultural Inmaterial. Fuerte de la Moría – Conservera Ballota. La comitiva se dirigirá al Fuerte de la Moría para contemplar la elaboración artesanal de la semiconserva de anchoa del Cantábrico en aceite de oliva, a cargo de empleados de la empresa familiar Anchoas Ballota. Puerto pesquero de Llanes. La Familia Real saludará a los miembros de las Cofradías de Pescadores de Asturias, a los pescadores jubilados y a las viudas de los marineros fallecidos, así como a los armadores de la flota pesquera local. Posteriormente, subirá a bordo de la embarcación Nuevo Sandra María, donde el patrón mayor, Ángel Batalla, explicará las formas tradicionales de la pesca artesanal y de bajura. La Rula. La Familia Real participará en una subasta inversa o puja a la baja, el sistema tradicional de venta de pescado empleado en la rula de Llanes, un legado que se remonta al siglo XVI. 13:15 h. Marina seca – Acto institucional. Tendrá lugar la entrega del Premio al Pueblo Ejemplar de Asturias 2026 a la Cofradía de Pescadores Santa Ana, con intervenciones del alcalde de Llanes, Enrique Riestra; el presidente del jurado, Francisco Rodríguez; y la coordinadora de actividades culturales de la Cofradía, María Consuelo Perela, entre otros. El acto concluirá con la interpretación del Himno de Asturias a cargo de la banda de gaitas \"Llacín\", dirigida por Víctor Carbajal. Paseo de San Pedro – Enclave ruta marinera. La Familia Real recorrerá el antiguo sendero de la loma, desde donde se divisan incomparables vistas al mar Cantábrico, a la villa medieval y a la Sierra del Cuera, rememorando el paso de la princesa Leonor de Austria por Llanes en el siglo XVI. 14:00 h. Almuerzo marinero en el polideportivo municipal, al que acudirán las personas vinculadas a la cofradía y sus actividades. La jornada concluirá a las 15:15 h. con la despedida de la Familia Real por parte de las autoridades. Información práctica para asistentes El Ayuntamiento de Llanes recuerda que todo el recorrido urbano, las exhibiciones y el acto institucional en la marina seca son completamente públicos y abiertos a vecinos y visitantes. El trayecto estará acotado mediante vallado de seguridad para garantizar el correcto desarrollo de la visita. Se recomienda a la ciudadanía llegar con antelación, ya que se realizarán cortes de tráfico y controles de seguridad en el casco urbano desde primera hora de la mañana. Se habilitarán aparcamientos periféricos e itinerarios de acceso a pie en las entradas de la villa. Las personas acreditadas para el almuerzo deberán presentar obligatoriamente la invitación física y el DNI, siendo la invitación personal e intransferible. Asimismo, se recuerda que se deberá pasar por un arco detector de metales, por lo que se ruega tener en cuenta los objetos o accesorios metálicos para agilizar el acceso. El Ayuntamiento de Llanes anima a todos los vecinos y visitantes a acompañar a la Cofradía de Pescadores Santa Ana en este día tan especial y les agradece de antemano su colaboración para el buen desarrollo de los actos. Tardeo y verbena para terminar la jornada Como cierre festivo de la jornada, Ayuntamiento de Llanes y Cofradía de Pescadores, con la colaboración de Cardeo Fiesta, han organizado para la tarde y la noche del sábado un “Tardeo-Verbeneo Ejemplar” en el Puerto de Llanes. El evento arrancará a las 19:00 horas con la sesión del reconocido DJ Guille, quien será el encargado de caldear el ambiente y preparar al público para lo que vendrá después. Y a partir de las 20:30 horas se iniciará la actuación de la orquesta La última legión, que se prolongará hasta la 1:00 h de la madrugada, dando fin a la jornada festiva.","days":[24],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/pueblo_ejemplar.png?itok=xkxNTytM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_3_oct_nueva.jpg?itok=EnEi7SJg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/visita_teatralizada_10_y_11_nueva.jpg?itok=kYMn1lYg"],"source":"https://www.llanes.es/../es/visita-de-la-familia-real-llanes-premio-al-pueblo-ejemplar-de-asturias-2026"},{"title":"jornada muy especial","text":"Puerto de Llanes 24 Octubre 2026 A partir de las 19:00 h. Tardeo-Verbeneo Ejemplar (Puerto de Llanes) Tardeo y verbena para finalizar una jornada muy especial. Como cierre festivo de la jornada de entrega del Premio Pueblo Ejemplar a la Cofradia de Pescadores de Llanes, Ayuntamiento de Llanes y Cofradía de Pescadores, con la colaboración de Cardeo Fiesta, han organizado para la tarde y la noche del sábado un “Tardeo-Verbeneo Ejemplar” en el Puerto de Llanes. El evento arrancará a las 19:00 horas con la sesión del reconocido DJ Guille, quien será el encargado de caldear el ambiente y preparar al público para lo que vendrá después. Y a partir de las 20:30 horas se iniciará la actuación de la orquesta La Última Legión, que se prolongará hasta la 1:00 h de la madrugada, dando fin a la jornada festiva.","days":[24],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/pueblo_ejemplar.png?itok=xkxNTytM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/tardeo_1.jpg?itok=wJr5rRc6","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_jornadas_de_cine_y_patrimonio.jpg?itok=pmnGd5EQ"],"source":"https://www.llanes.es/../es/tardeo-verbeneo-ejemplar-puerto-de-llanes"},{"title":"Concierto: \"Las Nietas del Charli\"","text":"Casino de Llanes 19:30 Concierto: \"Las Nietas del Charli\". III Noches del Casino de Llanes Sábado 24 de octubre, a las 19:30 h.: \"LAS NIETAS DEL CHARLI\". Folk progresivo ENTRADAS ONLINE GRATUITAS, PREVIA RESERVA EN: Las hermanas Raquel y María Rubio, conocidas artísticamente como Las Nietas Del Charli, acaban de dar un paso importante en su trayectoria con el lanzamiento de “Un Sol Dentro”, su nuevo álbum de estudio. Un trabajo que no solo consolida su identidad sonora, sino que también abre una nueva etapa dentro del folk alternativo en castellano, más luminosa, íntima y expansiva. El disco ha sido grabado y producido por Campi Campón, un nombre clave en la producción contemporánea que ha trabajado con artistas como Natalia Lafourcade, Jorge Drexler o Vetusta Morla. Su firma se nota en el sonido del álbum: cuidado en los detalles, texturas orgánicas y una sensibilidad que acompaña sin invadir. Antes de este lanzamiento completo, el grupo ya había ido dejando pistas del camino con varios singles que generaron expectación en su público y que ya dimos cuenta desde Chicas En Banda: “Rabia”, “Distancia” y “Pájaro De Plata”. Temas que funcionaron como pequeñas ventanas al universo emocional del disco, donde conviven la fragilidad, la fuerza y una poética muy personal. “Un Sol Dentro” está compuesto por nueve canciones que funcionan como un recorrido emocional coherente, casi como si cada pista fuera una estación distinta de un mismo viaje interior. Hay folk, sí, pero también exploración sonora, atmósferas modernas y una narrativa que apuesta por lo íntimo sin perder alcance.","days":[24],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/las_nietas_del_charli.jpg?itok=9-SSOr8h","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_meninas_en_el_casino.jpg?itok=z8-p0w9U","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7"],"source":"https://www.llanes.es/../es/concierto-las-nietas-del-charli-iii-noches-del-casino-de-llanes"},{"title":"Feria Agroecolóxica y Producción Local: \"Domingos de Llantariega\" (Llanes) 10:00 h","text":"Parque de Posada Herrera. Llanes 10:00 - 15:00 Feria Agroecolóxica y Producción Local: \"Domingos de Llantariega\" (Llanes) 10:00 h. - Apertura del mercado con productos locales, ecológicos y con IGP. 10:00 h. / 14:30 h. - Presencia de un corral de muestra de animales de raza autóctona asturiana. 10:00 h. / 15:00 h. - Reparto de bolsas de tela personalizadas a los expositores. 11:00 h. / 14:00 h. - Actuación de la Bandina Tradicional Los Muiles. 15:00 h. - Cierre del Mercáu.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_3.jpg?itok=9oxkrcOG","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_2_0.jpg?itok=LfpEV9Mj","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/llantariega_25_oct.jpg?itok=isvFcRbS"],"source":"https://www.llanes.es/../es/feria-agroecoloxica-y-produccion-local-domingos-de-llantariega-llanes-2"},{"title":"II Jornadas de Cine y Patrimonio (Llanes) II JORNADAS DE CINE Y PATRIMONIO DE LLANES Cine, memoria y territorio","text":"Casa Municipal de Cultura de Llanes 26 Octubre 2026 - 05 Noviembre 2026 II Jornadas de Cine y Patrimonio (Llanes) II JORNADAS DE CINE Y PATRIMONIO DE LLANES Cine, memoria y territorio Una aproximación al patrimonio de Llanes a través de la creación cinematográfica y el archivo audiovisual. Las II Jornadas de Cine y Patrimonio de Llanes proponen un espacio de encuentro entre cine, educación, memoria y territorio. A través de una sesión formativa dirigida al alumnado de Bachillerato y de una programación abierta al público, exploraremos las posibilidades del cine como herramienta para conservar, interpretar y transmitir nuestro patrimonio, tanto colectivo como personal. Porque el cine también es una forma de mirar, recordar y contar quiénes somos y de dónde venimos. Muy pronto os contaremos más sobre las actividades abiertas al público.","days":[26],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_jornadas_de_cine_y_patrimonio.jpg?itok=pmnGd5EQ","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ii_muestra_de_cine_documental.jpg?itok=72T6jrGS","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_9_oct_nueva.jpg?itok=GgdZFL5y"],"source":"https://www.llanes.es/../es/ii-jornadas-de-cine-y-patrimonio-llanes"},{"title":"talleres, creación literaria, encuentros y recitales de Caravana de Poetas, proyecto itinerante impulsado","text":"Casino de Llanes 27 Octubre 2026 - 31 Octubre 2026 Consultar horarios. Caravana de Poetas (Llanes) Caravana de Poetas llega a Llanes. Del 27 al 31 de octubre, el Casino de Llanes acoge talleres, creación literaria, encuentros y recitales de Caravana de Poetas, proyecto itinerante impulsado por el Colectivo Masquepalabras en colaboración con la Plataforma BajoTeja. 27, 28 y 29 · 10:30–13:30 h. Taller La Primera Vez, con Alicia Merino y Alicia Pilarte. Inscripción: 646 371 472 · marulicha2005@yahoo.es Viernes 30 · 19:00 h. Muestra abierta al público de La Primera Vez. Sábado 31 · 12:00–13:30 h. El poema que encadena y nunca se detiene, con Ainhoa Janices Estraviz. Inscripción: caravanadepoetas@gmail.com Sábado 31 · 20:00–21:30 h. Recital con A. J. Ponce y Aura Jiménez + micro abierto. Reserva gratuita para la muestra y el recital en:","days":[27,28,29,30,31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/caravana_de_poetas.jpg?itok=qeYAthp1","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/caravana_de_poetas1.jpg?itok=kd0Rw6kL","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_de_creacion_y_narracion_de_cuentos.jpg?itok=DgNLpmCY"],"source":"https://www.llanes.es/../es/caravana-de-poetas-llanes"},{"title":"llanes en verso llanes","text":"Casa Municipal de Cultura de Llanes 19:00 \"Llanes en verso\" (Llanes) Llanes en verso reúne literatura, imagen y música en directo en una propuesta de la Asociación de Escritores y Escritoras de Asturias. El proyecto combina una parte audiovisual con un recital poético musical en el que participan poetas de la asociación, con la música del Dúu Mestura y la actuación del cantautor Haim Álvarez. Jueves 29 de octubre. 19:00 h. Casa Municipal de Cultura de Llanes Entrada gratuita. Reserva en:","days":[29],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/llanes_en_verso_29_oct.jpg?itok=U9jlLhlW"],"source":"https://www.llanes.es/../es/llanes-en-verso-llanes"},{"title":"Halloween en Posada la Vieja","text":"Posada La Vieja 30 Octubre 2026 A partir de las 23:00 h. Halloween en Posada la Vieja Con la actuación de la Orquesta TEKILA, a las 00:00 h., y DJ Vas Bailar. ENTRADA: 5 €. PUNTOS DE VENTA DE ENTRADAS EN: Zapatería Pisando Fuerte (Posada de Llanes). Taquilla: En la entrada del recinto a partir de las 22:30 h. Lugar: Plazoleta de Posada La Vieja. Apertura de puertas: 23:00 h. Y como todos los años... ¡¡Concurso de disfraces!!!","days":[30],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_en_posada_la_vieja.jpg?itok=Ho9q1hXo","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_3.jpg?itok=9oxkrcOG","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_del_pilar_posada_2_0.jpg?itok=LfpEV9Mj"],"source":"https://www.llanes.es/../es/halloween-en-posada-la-vieja"},{"title":"Taller Infantil: “La mano de Miércoles” (Llanes) Vuelven las actividades del Centro cultural infantil de L","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:30 - 18:30 Taller Infantil: “La mano de Miércoles” (Llanes) Vuelven las actividades del Centro cultural infantil de Llanes con talleres para crear, experimentar, imaginar y acercarnos a la cultura asturiana. Y este curso estrenamos una novedad: las inscripciones se harán a través de Eventbrite. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 6 a 10 años. Inscripción gratuita en Eventbrite: Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–21:30 Agenda de OCTUBRE Vie 9 · 17:30–18:30 — “Pulseras espanta-brujas” Vie 9 · 18:30–19:30 — “Baba de hombre lobo” Sáb 10 · 17:30 — “Las Hadas de la pomarada”, de Elisabet Martín Teatro Vie 16 · 17:30 — “Academia de detectives”, de Susana María Sela Vie 23 · 17:30–18:30 — “Atrezo de Halloween: diadema cuchillo” Vie 30 · 17:30–18:30 — “La mano de Miércoles” Vie 30 · 18:30–19:30 — “Huesos de zombi”","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_llanes.jpg?itok=m2xpMnob","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva.jpg?itok=Bozh_icg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva_0.jpg?itok=PUFeMWwg"],"source":"https://www.llanes.es/../es/taller-infantil-la-mano-de-miercoles-llanes"},{"title":"Taller Infantil: “Huesos de zombi” (Llanes) Vuelven las actividades del Centro cultural infantil de Llanes","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 18:30 - 19:30 Taller Infantil: “Huesos de zombi” (Llanes) Vuelven las actividades del Centro cultural infantil de Llanes con talleres para crear, experimentar, imaginar y acercarnos a la cultura asturiana. Y este curso estrenamos una novedad: las inscripciones se harán a través de Eventbrite. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 6 a 10 años. Inscripción gratuita en Eventbrite: Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–21:30 Agenda de OCTUBRE Vie 9 · 17:30–18:30 — “Pulseras espanta-brujas” Vie 9 · 18:30–19:30 — “Baba de hombre lobo” Sáb 10 · 17:30 — “Las Hadas de la pomarada”, de Elisabet Martín Teatro Vie 16 · 17:30 — “Academia de detectives”, de Susana María Sela Vie 23 · 17:30–18:30 — “Atrezo de Halloween: diadema cuchillo” Vie 30 · 17:30–18:30 — “La mano de Miércoles” Vie 30 · 18:30–19:30 — “Huesos de zombi”","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_llanes.jpg?itok=m2xpMnob","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva.jpg?itok=Bozh_icg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/programa_cultural_octubre_nueva_0.jpg?itok=PUFeMWwg"],"source":"https://www.llanes.es/../es/taller-infantil-huesos-de-zombi-llanes"},{"title":"CONCIERTO en La Talá \"LLANES MUSIC\" y ENTREGA DE PREMIOS","text":"Llanes 31 Octubre 2026 - 01 Noviembre 2026 Llanes de Miedo - Samaín 2026 SÁBADO 31 En el pórtico del Ayuntamiento: De 17:00 a 19:00 h. PINTACARAS. De 18:00 a 21:00 h. PHOTOCALL y PERFORMANCE. 20:00 h. Concentración de disfraces y DESFILE por las calles de Llanes donde el jurado valorará los disfraces, con la animación a cargo de la COMPAÑÍA TEATRO DESPIERTO y los MARIACHIS ÁGUILAS DE JALISCO. 21:00 h. CONCIERTO en La Talá \"LLANES MUSIC\" y ENTREGA DE PREMIOS. DOMINGO 1 19:00 a 21:00 h. PASAJE DEL TERROR en el Espacio Joven (Las Marismas), para todo el público en general a partir de 8 años. CONCURSO INFANTIL DE DISFRACES Categoría individual (hasta 3 personas) 1.º premio: 120 € 2.º premio: 90 € 3.º premio: 60 € Categoría de grupo (a partir de 4 personas) 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € CONCURSO DE FACHADAS Y JARDINES 1.º premio: 250 € 2.º premio: 200 € 3.º premio: 150 € 4.º premio: 100 € 5.º premio: 50 € CONCURSO DE INTERIORES Y ESCAPARATES DE COMERCIOS 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € CONCURSO DE INTERIORES Y ESCAPARATES DE BARES Y RESTAURANTES 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € INSCRIPCIONES Las inscripciones se realizarán en la Oficina de Turismo de Llanes. Teléfono: 985 400 164 Correo electrónico: turismo@ayuntamientodellanes.com Horario de martes a sábado: de 10:00 a 14:00 h y de 16:00 a 18:30 h. Plazos de inscripción: Concursos de decoración: del martes 20 al miércoles 28 de octubre de 2026, hasta las 18:30 h. Concurso infantil de disfraces: del martes 20 al sábado 31 de octubre de 2026, hasta las 14:00 h. Entrega de premios: sábado 31 de octubre de 2026, a las 21:30 h, en el Ayuntamiento de Llanes. Consulta las bases completas del concurso en el documento PDF disponible en el apartado de información adicional. Información adicional bases_premios_samain_2026.pdf","days":[28,31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_nando_agueros.jpg?itok=aoRqH3f7","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_16_oct.jpg?itok=_IbRHKQ9","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/premios_obdulia.jpg?itok=j-KxqXs2"],"source":"https://www.llanes.es/../es/llanes-de-miedo-samain-2026"},{"title":"Halloween en Balmori ¡¡UN AÑO MÁS HALLOWEEN LLEGA A BALMORI","text":"Colegio de Balmori 31 Octubre 2026 A partir de las 17:00 h. Halloween en Balmori ¡¡UN AÑO MÁS HALLOWEEN LLEGA A BALMORI! Tenemos preparada una tarde llena de diversión, sustos y muchas sorpresas: CONCURSO DE DISFRACES: ¡Saca tu lado más terrorífico y sorpréndenos con tu disfraz! Premio: ¡Un cono gigante de gominolas! CONCURSO DE FACHADAS TERRORÍFICAS: ¡Decora tu casa y convierte Balmori en un pueblo de auténtico miedo! Premio: ¡Un vale para disfrutar de una comida en La Cambarina! JUEGOS INFANTILES DE INFARTO MERIENDA DE MIEDO para reponer fuerzas! ¡IMPORTANTE! INSCRIPCIONES Y VOTACIONES: Para participar tanto en los juegos como en los concursos será necesario inscribirse previamente de forma GRATUITA. En el caso de los concursos de disfraces y fachadas terroríficas, a cada participante se le asignará un número identificativo que se utilizará para las votaciones. ¿Cómo elegiremos a los ganadores este año? Este año hemos decidido cambiar la dinámica de las votaciones. Se repartirán papeletas de forma aleatoria entre algunos de los asistentes, quienes serán los encargados de votar por su participante favorito en cada categoría: disfraces y fachadas terroríficas. El participante que consiga el mayor número de votos en cada categoría será el ganador del premio correspondiente. A diferencia del año pasado, este año los miembros de la comisión y de la organización no participarán en las votaciones. De esta forma, serán los propios asistentes quienes decidan los ganadores. Fecha límite de inscripción: 30 de octubre. ¡Os esperamos en BALMORI!","days":[30,31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_en_balmori.jpg?itok=j0vjL1y7","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/atrezo_de_halloween.jpg?itok=U8wmwrjb","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_en_posada_la_vieja.jpg?itok=Ho9q1hXo"],"source":"https://www.llanes.es/../es/halloween-en-balmori"},{"title":"Amagüestu (Llamigu) En la Escuela, a partir de las 17:00 h","text":"Llamigu 31 Octubre 2026 A partir de las 17:00 h. Amagüestu (Llamigu) En la Escuela, a partir de las 17:00 h. CONCURSO DE POSTRES. Ingrediente principal la calabaza. Premio para los 4 primeros. Juegos tradicionales y Bingo. PRECIO 5 €/PERSONA (el precio incluye un vaso de sidra y un cucurucho de castañas) PINCHEO PARA TODOS LOS ASISTENTES","days":[31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/amaguestu_llamigu_1.jpg?itok=UaOh_TlM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/amaguestu_puertas_vidiago.jpg?itok=6ksGeMmV"],"source":"https://www.llanes.es/../es/amaguestu-llamigu"},{"title":"Amagüestu (Puertas de Vidiago) ¡Nos vamos de Amagüestu","text":"Puertas de Vidiago 31 Octubre 2026 a partir de las 20:00 h. Amagüestu (Puertas de Vidiago) ¡Nos vamos de Amagüestu! ​Si pensabais que con el segador se acababa todo... ¡nada de eso! Finalizamos octubre y celebramos el otoño a lo grande. ​El 31 de octubre nos vemos en Puertas a partir de las 20:00 h. para celebrar el Amagüestu como se merece. ​Tendremos castañas, sidra, parrilla... ¡y mucha música con la romería amenizada por David y DJ Tony! ​¡Os esperamos!","days":[31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/amaguestu_puertas_vidiago.jpg?itok=6ksGeMmV","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/amaguestu_llamigu_1.jpg?itok=UaOh_TlM"],"source":"https://www.llanes.es/../es/amaguestu-puertas-de-vidiago-0"},{"title":"Fiesta de Halloween (San Roque del Acebal) Sábado 31 de octubre, a las 17:00 h","text":"San Roque del Acebal 31 Octubre 2026 A partir de las 17:00 h. Fiesta de Halloween (San Roque del Acebal) Sábado 31 de octubre, a las 17:00 h. en la Casa Concejo de San Roque del Acebal. ¡Ven disfrazado! Concurso de disfraces Sorteos Buen ambiente...","days":[31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/fiesta_halloween_san_roque.jpg?itok=TF2nGu7s","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_san_roque.jpg?itok=FGZLVILL","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_rosariu_san_roque_0.jpg?itok=fkxsymjV"],"source":"https://www.llanes.es/../es/fiesta-de-halloween-san-roque-del-acebal"},{"title":"Día de los Muertos (Lledías) HALLOWEEN EN LLEDÍAS","text":"Lledías 31 Octubre 2026 A partir de las 18:00 h. Día de los Muertos (Lledías) HALLOWEEN EN LLEDÍAS El sábado 31 DE OCTUBRE nuestro pueblo vuelve a convertirse en una terrorífica fiesta... ¿TE ATREVES A VENIR? TRADICIONAL TRUCO O TRATO ZURRUInicio en la Capilla a las 18:00 horas. TALLERES HALLOWEENEROSManualidades y juegos infantiles gratuitos. ZONA DE BARBebidas del inframundo para resucitar a los muertos. PUESTO DE DULCES Y CHOCOLATEPlaceres mortales a precios populares. KARAOKE INFERNALInfantil y adultos. LA NOCHE DE LOS TORTOS VIVIENTESNuestra cocina del inframundo a precios populares.","days":[31],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_lledias_0.jpg?itok=xncYCgMK","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/san_francisco_lledias_5.jpg?itok=hSa5bbbg","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/atrezo_de_halloween.jpg?itok=U8wmwrjb"],"source":"https://www.llanes.es/../es/dia-de-los-muertos-lledias"}];const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1);let selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];document.getElementById('todayLabel').textContent='Hoy · '+new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(now);function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function paint(){document.getElementById('month').textContent=months[view.getMonth()]+' '+view.getFullYear();const grid=document.getElementById('days');grid.innerHTML='';const offset=(new Date(view.getFullYear(),view.getMonth(),1).getDay()+6)%7,total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),prevTotal=new Date(view.getFullYear(),view.getMonth(),0).getDate();for(let i=0;i<42;i++){let day,month=view.getMonth(),year=view.getFullYear(),muted=false;if(i<offset){day=prevTotal-offset+i+1;month--;muted=true;if(month<0){month=11;year--}}else if(i>=offset+total){day=i-offset-total+1;month++;muted=true;if(month>11){month=0;year++}}else day=i-offset+1;const b=document.createElement('button');b.className='day'+(muted?' muted':'');if(key(year,month,day)===key(now.getFullYear(),now.getMonth(),now.getDate()))b.classList.add('today');if(key(year,month,day)===key(selected.getFullYear(),selected.getMonth(),selected.getDate()))b.classList.add('selected');if(EVENTS.some(e=>e.days.includes(day)&&year===2026&&month===9))b.classList.add('has');b.textContent=day;b.setAttribute('aria-label',`${day} ${months[month]} ${year}`);b.onclick=()=>{selected=new Date(year,month,day);if(month!==view.getMonth()||year!==view.getFullYear())view=new Date(year,month,1);paint();showEvents()};grid.appendChild(b)}}function showEvents(){const label=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selected);document.getElementById('selectedLabel').textContent=label[0].toUpperCase()+label.slice(1);const found=EVENTS.filter(e=>selected.getFullYear()===2026&&selected.getMonth()===9&&e.days.includes(selected.getDate()));document.getElementById('count').textContent=found.length?`${found.length} evento${found.length===1?'':'s'}`:'';const root=document.getElementById('events');root.innerHTML='';if(!found.length){root.innerHTML='<div class="empty"><strong>No hay eventos registrados para esta fecha.</strong>Prueba otra fecha del calendario.</div>';return}for(const e of found){const card=document.createElement('article');card.className='event';const title=document.createElement('h3');title.textContent=e.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=e.days.length>1?`Evento · ${e.days.join(', ')} de octubre`:'Evento de la agenda';const desc=document.createElement('p');desc.className='desc';desc.textContent=e.text;card.append(title,meta,desc);if(e.images.length){const gallery=document.createElement('div');gallery.className='gallery';e.images.forEach((src,i)=>{const a=document.createElement('a');a.href=src;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label','Abrir fotografía '+(i+1));const img=document.createElement('img');img.src=src;img.alt=e.title+' · fotografía '+(i+1);img.loading='lazy';a.appendChild(img);gallery.appendChild(a)});card.appendChild(gallery)}const link=document.createElement('a');link.className='source';link.href=e.source;link.target='_blank';link.rel='noopener';link.textContent='Ver ficha original ↗';card.appendChild(link);root.appendChild(card)}}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);paint()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);paint()};paint();showEvents();
</script></body></html>
