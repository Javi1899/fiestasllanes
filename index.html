pórtico del Ayuntamiento 20:30 a 22:30 h. PASAJE DEL TERROR en el Espacio Joven (Las Marismas), para todo el público en general a partir de 8 años. CONCURSO INFANTIL DE DISFRACES Categoría individual (hasta 3 personas) 1.º premio: 120 € 2.º premio: 90 € 3.º premio: 60 € Categoría de grupo (a partir de 4 personas) 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € CONCURSO DE FACHADAS Y JARDINES 1.º premio: 250 € 2.º premio: 200 € 3.º premio: 150 € 4.º premio: 100 € 5.º premio: 50 € CONCURSO DE INTERIORES Y ESCAPARATES DE COMERCIOS 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € CONCURSO DE INTERIORES Y ESCAPARATES DE BARES Y RESTAURANTES 1.º premio: 200 € 2.º premio: 150 € 3.º premio: 100 € INSCRIPCIONES Las inscripciones se realizarán en la Oficina de Turismo de Llanes. Teléfono: 985 400 164 Correo electrónico: turismo@ayuntamientodellanes.com Horario de martes a sábado: de 10:00 a 14:00 h y de 16:00 a 18:30 h. Plazos de inscripción: Concursos de decoración: del martes 20 al miércoles 28 de octubre de 2026, hasta las 18:30 h. Concurso infantil de disfraces: del martes 20 al sábado 31 de octubre de 2026, hasta las 14:00 h. Entrega de premios: sábado 31 de octubre de 2026, a las 21:30 h, en el Ayuntamiento de Llanes. Consulta las bases completas del concurso en el documento PDF disponible en el apartado de información adicional. Información adicional bases_premios_samain_2026.pdf","days":[1],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cartel_llanes_de_miedo_1.jpg?itok=2dVEZ8VT"],"source":"https://www.llanes.es/../es/llanes-de-miedo-samain-2026","month":10,"place":"Llanes"},{"title":"Exposición \"Retrato y Sociedad\" (Porrúa) Se prorroga la exposición de Daniel A","text":"https://museoriente.com Museo del Oriente de Asturias (Porrúa) 11:00 - 13:30 Horario de museo: https://museoriente.com Exposición &quot;Retrato y Sociedad&quot; (Porrúa) Se prorroga la exposición de Daniel A. Fervienza Permanecerá abierta hasta el 1 de noviembre Tras el cierre el pasado fin de semana –por razones técnicas al celebrarse el XXX Mercáu de Porrúa 2026- de la Exposición “Retrato y sociedad” en la obra fotográfica de Daniel Álvarez Fervienza, Llanes 1885 -1899. El Museo del Oriente de Asturias (Porrúa), hoy se reabre al público en el horario ordinario del mismo. La prórroga se extiende hasta el miércoles día 30 de setiembre, La exposición es la más visitada de la historia de nuestro Museo, ya sobrepasó los 5.500 visitantes. Nota de Prensa de 2 de abril de 2026 (Inauguración) Daniel Á. Fervienza (1857-1951), es una de las grandes figuras de la fotografía en Llanes de las dos últimas décadas del siglo XIX. Natural de Somiedo y formado en Madrid, trabajó como maestro y fotógrafo en Llanes durante 15 años, antes de tomar posesión - en el año 1899 - de la plaza de profesor de Ciencias en la Escuela Normal de Oviedo. La actividad fotográfica de Daniel Á. Fervienza nos ha legado placas fotográficas de gran valor, tanto desde la perspectiva documental como artística. El retrato fue uno de los principales activos de su obra fotográfica, actuando también como un singular reportero gráfico en acontecimientos sociales, fiestas, celebraciones y reuniones familiares. En sus galerías y en exteriores de Llanes y Cardosu posaron clientes de todos los sociales relacionadas con el concejo: pequeña burguesía, aristocracia, indianos, campesinos, educadores y eclesiásticos, entre otros, captando con gran maestría las distintas actitudes ante la cámara de las personas retratadas. En muchos aspectos entró en la modernidad de la fotografía. Su técnica, su composición y el buen uso de la luz en sus imágenes le hicieron acreedor de un lugar destacado en la historia de la fotografía de Llanes. La calidad de sus retratos permite el estudio en detalle de la indumentaria masculina y femenina, tanto del traje tradicional llanisco, como de la vestimenta popular y burguesa de la época. La exposición “Retrato y sociedad” de Daniel Á. Fervienza nos ofrece la oportunidad de apreciar una sorprendente calidad en una obra que se realiza en los inicios de la fotografía en Asturias. La exposición consta de 44 fotografias (tamaños 30 x40 cm y 40 x 50) de las que dos terceras partes son inéditas y una vitrina con elementos de gran interés, propiedad del fotógrafo: libros, fotografías de época, elementos de su laboratorio, libros sobre fotografías, agendas, un muestrario de cartones…etc. Abrió el acto del presidente de las Fundación titular del Museo del Oriente (Porrúa), José Luis Villaverde Amieva quien destacó “la importancia de esta exposición, que aporta nuevos documentos para la historia de la fotografía en Llanes y Asturias, hasta ahora desconocidos”. Anunció tambien que habrá “una segunda exposición sobre el retrato infantil para el ejercicio de 2027, con un catálogo que abarcará ambas, en donde la práctica totalidad de las fotografías serán inéditas”. Presentó al comisario Antonio Diego Llaca, llanisco, licenciado en Geografía e Historia, profesor de estas disciplinas y bisnieto del fotógrafo. Es el propietario del archivo de Daniel Á. Fervienza, que estuvo al cuidado de esta exposición en su totalidad: edición, impresión, y montaje de la totalidad de la misma. A continuación tomo la palabra el comisario de las exposición Antonio Diego Llaca, propietario del archivo de Daniel Á. Fervienza quien habló de “las técnicas fotográficas empleadas por el fotógrafo, durante el periodo de quince años a que se refiere la exposición” y de la “constante puesta al dia en las que iban surgiendo en unos momentos en que la evolución de la fotografía era muy dinámica, que se publicitaba como “Nueva Fotografía”. Por lo que se refiere al tema de contenidos se refirió a las características de los retratos expuestos, destacando los distintos tipos, los distintos entornos, ya interiores, ya exteriores, analizando el atrezzo de los diversos estudios en que trabajó y de manera singular “la preocupación por la composición de lo que podríamos llamar cuadros escénicos que son muchos de los retratos colectivos”. Remarcó que la labor fotográfica de Fervienza “no supuso menoscabo en la que fue su principal actividad, la labor pedagógica, como maestro” en Llanes y Cardosu. Finalmente se refirió al archivo fotográfico y su recuperación y aportación a la historia de la fotografía. Permanecerá abierta hasta el 22 de agosto (prorrogada hasta el 30 de septiembre, en horario de museo: https://museoriente.com Acceso gratuito. HORARIOS Del 18 de marzo al 30 de junio y del 9 de septiembre al 15 de diciembre (excepto puente): Martes a jueves, domingos y festivos: 11:00 a 13:30 h. Viernes y sábados: 11:00 a 13:30 h. y 17:00 a 19:00 h. Semana Santa De jueves a domingo: 11:00 a 13:30 h. y 17:00 a 20:00 h. Del 1 de julio al 8 de septiembre: De martes a domingo*: 11:00 a 13:30 h. y 17:00 a 20:00 h. *El segundo domingo de agosto cerramos por fiesta local.","days":[1],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_retrato_y_sociedad_porrua_1.jpg?itok=BT9KSInM","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_porrua_1.jpg?itok=G7uZQCzU"],"source":"https://www.llanes.es/../es/exposicion-retrato-y-sociedad-porrua","month":10,"place":"Museo del Oriente de Asturias (Porrúa)"},{"title":"talleres específicos: manualidades, artísticos, cenas saludables, cine, mesas redondas, juegos cooperativo","text":"https://www.ayuntamientodellanes.com/espacio-joven1 Paseo de Las Marismas (Llanes) 19:00 - 23:00 viernes y sábados. Domingos de 19:00 a 21:00 h. Espacio Joven Llanes Programa Municipal de Ocio Alternativo Juvenil, situado en el Paseo de las Marismas s/n de Llanes (junto al parque infantil: edificio del antiguo matadero municipal). Ofrece actividades para adolescentes y jóvenes de entre 12 y 18 años durante los fines de semana de todo el año: viernes, sábados y domingos; puentes no lectivos y vacaciones escolares de Semana Santa y Navidad. Su horario habitual es 19 a 23 horas, excepto domingos de 19 a 21 horas. El horario de cierre puede prorrogarse puntualmente ante actividades o celebraciones extraordinarias/especiales. Consta de dos plantas y está equipado con mesa de ping-pong, futbolín, billar, consolas, juegos de mesa, diana... Su acceso es libre y gratuito. Cuenta con dos monitores/as-animadores/as y ofrece además cada fin de semana talleres específicos: manualidades, artísticos, cenas saludables, cine, mesas redondas, juegos cooperativos, concursos... El objetivo fundamental de este programa municipal es la promoción del desarrollo personal y social de esta franja de población del municipio, así como su participación como ciudadanía activa. Otros objetivos son: ofrecer alternativas de ocio educativo, activo, creativo y no consumista; la adquisición de nuevas habilidades sociales y de relación; contribuir a la educación en valores: coeducación, medioambiental, intercultural, para la paz... Y la realización de actividades que no limiten la participación por motivos económicos. Puesto en funcionamiento en 2009 por la Oficina Joven Municipal ha ido evolucionando y creciendo hasta la actualidad. Desde Octubre de 2021 ofrece, a las familias y menores que lo necesitan, la opción de transporte gratuito para acudir al programa. Instagram: espacio_joven_llanes Facebook: EspacioJovenLlanes Más información de este programa en la Oficina Joven Municipal Información adicional ficha_autor._imagen_menores_de_edad.pdf","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ej_del_23_al_25_0.jpg?itok=YkN3gdQK","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ej_cartel_nuevo.jpg?itok=PYG8Ha0j","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ej_1.jpg?itok=l0VsHkKK"],"source":"https://www.llanes.es/../es/espacio-joven-llanes-67","month":10,"place":"Paseo de Las Marismas (Llanes)"},{"title":"Halloween en Parres","text":"https://www.facebook.com/profile.php?id=100070768422009 Parres de Llanes 02 Noviembre 2026 A partir de las 17:00 h. Halloween en Parres A las 17:00 h. en La Bolera de la Escuela, comenzaremos con un recorrido por el pueblo y terminaremos con una merienda en la Casa Conceju.","days":[2],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/halloween_parres_1.jpg?itok=FcJbdMht"],"source":"https://www.llanes.es/../es/halloween-en-parres","month":10,"place":"Parres de Llanes","schedule":"Lunes 2 de noviembre · A partir de las 17:00 h"},{"title":"Exposición: \"Indumentaria tradicional del Oriente de Asturias","text":"Casa Municipal de Cultura de Llanes 11:00 - 13:00 y 17:30 - 20:00 h. Exposición: &quot;Indumentaria tradicional del Oriente de Asturias... Por la pinta son de Llanes&quot; (Llanes) La exposición de indumentaria tradicional titulada “Indumentaria tradicional del Oriente de Asturias… Por la pinta son de Llanes”. La misma, surge fruto de la colaboración entre la Asociación de Amigos de la Indumentaria Tradicional, la colección Javier Emperador y el Ayuntamiento de Llanes. La exposición cuenta con varios apartados sobre distintos tipos de indumentaria: trajes para el ramu, trajes de uso cotidiano, trajes de cristianar, trajes de labor, complementos y piezas de joyería, etc., así como material gráfico, fotografías en su mayor parte. La mayoría de las piezas en exposición son trajes de finales del s. XIX y comienzos del s. XX.","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/por_la_pinta_son_de_llanes__0.jpg?itok=2tp8_wKW","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/expo_indumentaria_0.jpg?itok=vf-6Mjy5"],"source":"https://www.llanes.es/../es/exposicion-indumentaria-tradicional-del-oriente-de-asturias-por-la-pinta-son-de-llanes-llanes-0","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"IV Trail El Mazucu Rebulle","text":"https://montecarreras.com/carreras/trail-el-mazucu-rebulle-2026 El Mazucu 07 Noviembre 2026 IV Trail El Mazucu Rebulle El Trail El Mazucu Rebulle 2026 se celebrará el sábado 7 de noviembre en El Mazucu (Llanes), con salida a las 10:00 horas. Una carrera por montaña que se adentra en plena Sierra del Cuera, sobre un terreno técnico en el que predomina la piedra caliza. Tomando como referencia el recorrido de 2025, la prueba cuenta con aproximadamente 13,6 km y asciende desde El Mazucu hasta Peña Blanca, punto más alto del trazado a 1.182 metros de altitud, antes de regresar de nuevo al pueblo. El recorrido acumula alrededor de 950 metros de desnivel positivo y discurre en su mayor parte por terreno de montaña, con pasos técnicos característicos del Cuera. Durante la carrera se atraviesan lugares como Cuetu Doblos, El Churru, el Caleyón de Reburdiallu o Peña Blanca, desde donde el recorrido ofrece vistas hacia los Picos de Europa. Una prueba corta pero exigente para descubrir uno de los rincones más característicos de la montaña llanisca y enfrentarse al terreno calizo de la Sierra del Cuera. +Info aquí. Información adicional reglamento.pdf","days":[7],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cartel_trail_mazucu.jpg?itok=GmwXJoYt"],"source":"https://www.llanes.es/../es/iv-trail-el-mazucu-rebulle","month":10,"place":"El Mazucu","schedule":"Sábado 7 de noviembre · Salida a las 10:00 h"},{"title":"V Encuentro Folclórico","text":"https://www.facebook.com/profile.php?id=100029351109118 Posada de Llanes 07 Noviembre 2026 V Encuentro Folclórico (Posada de Llanes) 12:00 h. Desfile de los grupos: El Zascandil y Grupo Folclórico Virgen de las Nieves. Salida desde el Centro Cívico hasta la plaza Parres Piñera. 14:00 h. Comida popular en la plaza Parres Piñera. 16:30 h. Desfile de grupos desde el Centro Cívico a la plaza Parres Piñera con actuación de los grupos: Los Chachipés (El Escorial - Madrid). Grupo Folclórico Virgen de las Nieves (Tanos - Cantabria). El Zascandil (Palencia). Grupo de Baile de la Parroquia de Posada. Se cerrará este encuentro bailando todos una danza castellana y la danza prima con el himno de Asturias. *La carretera principal se cortará de 12:00 a 13:00 h. y de 16:30 a 18:00 h.","days":[7],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/v_encuentro_folclorico_posada.jpg?itok=2onegjdT"],"source":"https://www.llanes.es/../es/v-encuentro-folclorico-posada-de-llanes","month":10,"place":"Posada de Llanes","schedule":"Sábado 7 de noviembre"},{"title":"Feria Ganadera de San Martín","text":"Nueva de Llanes 08 Noviembre 2026 A partir de las 10:00 h. Feria Ganadera de San Martín (Nueva de Llanes) FERIA GANADERA DE SAN MARTÍN EN NUEVA. DOMINGO 8 DE NOVIEMBRE. PRAU DE NAVADOSU. DESDE LAS 10:00 H. Ganado autorizado: BOBINO, EQUINO, CAPRINO Y OVINO.","days":[8],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria-san-martin-nueva-de-llanes-3.jpeg?itok=LgHi4ukb"],"source":"https://www.llanes.es/../es/feria-ganadera-de-san-martin-nueva-de-llanes","month":10,"place":"Nueva de Llanes","schedule":"Miércoles 11 de noviembre"},{"title":"Fiesta de San Acisclo","text":"Pendueles 14 Noviembre 2026 Fiesta de San Acisclo (Pendueles) Sábado 14 de Noviembre 12:00 h. Misa Solemne en honor a San Acisclo. 20:00 h. Habrá castañas asadas y sidra dulce, amenizado por el GRUPO DE GAITAS PRINCIPADO. 22:00 h. Comenzará la fiesta con la actuación de GRUPO DA SILVA y DJ CARDEO. ¡HAY CARPA!","days":[14],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/foto_traje_aldeana_4_3.jpg?itok=exxxORUQ"],"source":"https://www.llanes.es/../es/fiesta-de-san-acisclo-pendueles","month":10,"place":"Pendueles","schedule":"Sábado 14 de noviembre · Misa 11:45 h · Verbena 22:00 h"},{"title":"Llega la Navidad al Valle de San Jorge","text":"Nueva de Llanes 21 Noviembre 2026 - 22 Noviembre 2026 Llega la Navidad al Valle de San Jorge (Nueva de Llanes) 21 y 22 de noviembre de 2026 El Valle de San Jorge se prepara para dar la bienvenida a la Navidad con un mercadillo navideño, que se celebrará los días 21 y 22 de noviembre en Nueva de Llanes. Una oportunidad para adelantarse a las fiestas, encontrar ideas para decorar el hogar, preparar los negocios y buscar inspiración para estas fechas tan especiales. Inscripciones para participar en el mercadillo: Las personas interesadas en participar pueden solicitar información e inscribirse a través del correo electrónico: mercadillonavidadnueva@gmail.com","days":[21,22],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/llega_la_navidad_al_valle_de_san_jorge.jpg?itok=OvMSX1v9"],"source":"https://www.llanes.es/../es/llega-la-navidad-al-valle-de-san-jorge-nueva-de-llanes","month":10,"place":"Nueva de Llanes","category":"fiesta","schedule":"21 y 22 de noviembre · Mercadillo navideño"},{"title":"Fiestas de San Zornín y XXV Jornadas de Deporte Tradicional","text":"Llames de Pría 27 Noviembre 2026 - 28 Noviembre 2026 Fiestas de San Zornín y XXV Jornadas de Deporte Tradicional (Llames de Pría) Fiestas de San Zornín XXV Jornadas de Deporte Tradicional Dia 27 A partir de las 21,00 hrs. Amagüestu con Grupo de Gaitas Principado en todos los bares del pueblo, ensayo del Ramu y taller de bailes regionales. Dia 28 12,30.- Ofrecimiento del Ramu y Misa. A continuación bailes regionales. 17,30.- Muestra de folclore dirigido por Marta Elola (premio mujer rural del Oriente 2022). 19,30.- Deportes tradicionales. XXV Jornadas del Deporte Tradicional: tiro de cuerda, carrera de lecheras y Juegos tradicionales infantiles. A continuación espicha para todos. Verbena. *SEGÚN LA PROGRAMACIÓN DEL AÑO PASADO.","days":[27,28],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/foto_traje_aldeana_4_4.jpg?itok=JqviIpyO"],"source":"https://www.llanes.es/../es/fiestas-de-san-zornin-y-xxv-jornadas-de-deporte-tradicional-llames-de-pria","month":10,"place":"Llames de Pría","schedule":"Viernes 27 y sábado 28 de noviembre"},{"title":"Cine doméstico, memoria y archivo (Llanes)","text":"https://www.facebook.com/casaculturallanes Casa Municipal de Cultura de Llanes 18:30 Cine doméstico, memoria y archivo (Llanes) El jueves 5 de noviembre, la Casa de Cultura de Llanes acoge «Cine doméstico, memoria y archivo», una charla con la conservadora fílmica Irene Matas de Íscar sobre las películas familiares, su conservación y su valor para la memoria colectiva.espués veremos «My Mexican Bretzel», de Nuria Giménez Lorang, una película construida a partir de imágenes domésticas que adquieren una nueva vida en la pantalla. Jueves 5 de noviembre · 18:30 h. Casa Municipal de Cultura de Llanes Entrada gratuita. Reserva recomendada, pero no obligatoria: https://casaculturallanes.eventbrite.com Actividad de las II Jornadas de Cine y Patrimonio de Llanes.","days":[5],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/cine-domestico-memoria-y-archivo-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Actividad Infantil: «Origami de Stitch» (Llanes)","text":"https://www.facebook.com/casaculturallanes Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:00 - 18:00 Actividad Infantil: &quot;Origami de Stitch&quot; (Llanes) ¡Noviembre llega a La Curuxa con nuevas aventuras! Con el otoño, el Centro cultural infantil de Llanes se llena de propuestas para crear, imaginar y experimentar. Habrá origami, un encuentro con los libros y las aves, cuentos viajeros, historias de Samhain y un laboratorio para descubrir las texturas y los aromas del bosque. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 3 a 10 años (consulta las edades de cada actividad). Inscripción gratuita en Eventbrite: https://casaculturallanes.eventbrite.com Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–20:30 Agenda de NOVIEMBRE Vie 6 · 17:00–18:00 — «Origami de Stitch» · 6 a 10 años. En este taller jugaremos con el papel para crear figuras de Stitch que luego podremos usar para decorar libros, libretas o nuestra habitación. Vie 13 · 17:00–18:00 — «¿Por qué los pájaros no tienen rey?», con David Acera · 6 a 10 años. Sáb 14 · 17:00–18:00 — «Cuentos de maleta», con Letibú · 6 a 10 años. Vie 20 · 17:00–18:00 — «Cuentos de Samhain» · 3 a 6 años. Vie 27 · 17:00–18:00 — «Laboratorio sensorial» · 3 a 6 años.","days":[6],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/origami.jpg?itok=LLQ3wuBy"],"source":"https://www.llanes.es/../es/actividad-infantil-origami-de-stitch-llanes","month":10,"place":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes)"},{"title":"Cine Fórum: «Mandarinas» (Nueva de Llanes)","text":"Casa Cultura del Valle de San Jorge (Nueva) 19:00 Cine Fórum: &quot;Mandarinas&quot; (Nueva de Llanes) VIERNES 6 a las 19:00; CINE FÓRUM; Proyección de la película “Mandarinas” (Zaza Urushadze, 2013, 82´). En 1990, estalla la guerra en una provincia georgiana que busca la independencia. Ivo, un estonio, decide quedarse, a diferencia del resto de sus compatriotas, para ayudar a su amigo Margus con la cosecha de mandarinas. Al comenzar el conflicto, dos soldados resultan heridos delante de su casa, e Ivo se ve obligado a cuidar de ellos. Al terminar la proyección tendrá lugar un informal coloquio en el que los asistentes podrán expresar sus opiniones sobre la película.","days":[6],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/cine-forum-mandarinas-nueva-de-llanes","month":10,"place":"Casa Cultura del Valle de San Jorge (Nueva)"},{"title":"III Festival Teatro Total: «Preciosa» (Llanes)","text":"https://www.facebook.com/casaculturallanes Casino de Llanes 20:00 III Festival Teatro Total: &quot;Preciosa&quot; (Llanes) «Preciosa» · III Festival Teatro Total Un joven de alta cuna se enamora de una joven gitana. Para estar con ella deberá aceptar sus condiciones. Alicia Merino lleva a escena una versión oral de «La gitanilla» de Cervantes, acompañada por la música electrónica en vivo de Laura Nadal. La actuación forma parte de la tercera edición del Festival Teatro Total, organizado por la Asociación Cultural y Educativa Balsiar. Viernes 6 de noviembre · 20:00 h. Casino de Llanes. 40 minutos · Recomendada a partir de 12 años. Entradas: https://casaculturallanes.eventbrite.com","days":[6],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/teatro_nueva.jpg?itok=nrMVtneV","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/preciosa.jpg?itok=r8TIUNOw"],"source":"https://www.llanes.es/../es/iii-festival-teatro-total-preciosa-llanes","month":10,"place":"Casino de Llanes"},{"title":"XV Encuentros asturcántabros (Posada de Llanes)","text":"Posada de Llanes y Piedra 07 Noviembre 2026 - 08 Noviembre 2026 XV Encuentros asturcántabros (Posada de Llanes) SÁBADO 7 DE NOVIEMBRE 12:00 h. en la Plaza Parres Piñera: Acto institucional con alcaldes y autoridades. Posteriormente comida popular con paella y tortos. 17:00 h. en la Plaza Parres Piñera: Desfile por las calles de Posada con diferentes grupos folclóricos. Organiza la asociación de Comerciantes (Asepo). DOMINGO 8 DE NOVIEMBRE 12:00 h. en la Bolera de Piedra: Bolos de peñas asturiana y cantabra y pincheo.","days":[7,8],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/encuentros_asturcantabros.jpg?itok=nSQR9Ie_","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/v_encuentro_folclorico_posada_0.jpg?itok=TA_wJ1As","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_zumba_posada.jpeg?itok=ZTt0zt-D"],"source":"https://www.llanes.es/../es/xv-encuentros-asturcantabros-posada-de-llanes","month":10,"place":"Posada de Llanes y Piedra"},{"title":"I Cursu de Entendíos en Sidre del Oriente d’Asturies (Piedra)","text":"https://www.instagram.com/llanesquellagares/ Aula de Piedra 07 Noviembre 2026 I Cursu de Entendíos en Sidre del Oriente d´Asturies (Piedra) Llanes será el punto de partida de ‘Entendíos en Sidre’, una iniciativa formativa que nace con el objetivo de mejorar la preparación de los jurados de concursos y catas de sidra casera asturiana y avanzar hacia unos criterios comunes de valoración. El Ayuntamiento de Llanes y las entidades organizadoras, Campus Campu y la Asociación de Sidra Caseru del Conceju de Llanes, han presentado hoy este proyecto, cuya primera edición se celebrará el sábado 7 de noviembre en el Aula de Piedra de Llanes. El curso pretende dar respuesta a una necesidad compartida por quienes participan en los concursos sidreros: contar con una formación que permita valorar las sidras con mayor conocimiento, rigor y coherencia, independientemente del certamen en el que se participe. Aprender a catar, reconocer y valorar. La formación será impartida por Ricardo del Río, sumiller y miembro de la Cofradía de la Sidra, y combinará contenidos teóricos y prácticos sobre las características organolépticas de la sidra, la identificación de sus virtudes y defectos y la correcta utilización de las fichas de cata y puntuación. El programa incluye ejercicios prácticos, una prueba de conocimientos y un simulacro de concurso de sidra casera en el que los alumnos deberán aplicar los criterios aprendidos. Al finalizar la jornada recibirán un diploma avalado por FASCAS y la Cátedra de la Sidra. El encuentro concluirá con una espicha de convivencia entre alumnos y personas vinculadas a la organización. Un proyecto que nace del propio mundo sidrero. Entendíos en Sidre cuenta con el respaldo y la participación de personas vinculadas a diferentes ámbitos de la cultura sidrera asturiana. Como paso previo al curso, el pasado 9 de octubre se celebró en Llanes una reunión de su Comité Técnico, en la que representantes de asociaciones, llagareros caseros e industriales, escanciadores y profesionales relacionados con la sidra trabajaron para consensuar criterios comunes de valoración que sirvan de base a la formación. De Llanes al resto de Asturias. La elección de Llanes como sede de esta primera edición reconoce la tradición sidrera del concejo y el trabajo que desarrolla su tejido asociativo, especialmente la Asociación de Sidra Caseru del Conceju de Llanes. Pero la intención de los promotores va más allá de esta primera convocatoria. ‘Entendíos en Sidre’ nace con vocación de continuidad y con la aspiración de convertirse en una referencia formativa para quienes ejercen como jurado en los concursos de sidra asturiana. El proyecto supone también una aportación a la conservación y transmisión de los conocimientos asociados a la cultura sidrera asturiana, reconocida por la UNESCO como Patrimonio Cultural Inmaterial de la Humanidad en 2024. La primera edición cuenta con la colaboración del Ayuntamiento de Llanes, que respalda así una iniciativa que une formación, tradición sidrera y participación de asociaciones y profesionales del sector. El sábado 7 de noviembre, Llanes dará el primer paso de un proyecto que quiere contribuir a mejorar la forma de catar y valorar la sidra asturiana.","days":[7],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cursu_escanciadores3.jpg?itok=UdTZ0Vrc","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cursu.jpeg?itok=V-KGGjEG"],"source":"https://www.llanes.es/../es/i-cursu-de-entendios-en-sidre-del-oriente-dasturies-piedra","month":10,"place":"Aula de Piedra"},{"title":"Jornadas de Espeleología y Arqueología en Llanes","text":"Casa Municipal de Cultura de Llanes (1º planta) 17:30 Jornadas de Espeleología y Arqueología en Llanes La Casa Municipal de Cultura de Llanes acoge el sábado 7, la jornada \"Espeleología y Arqueología en Llanes\", una cita que reunirá a tres especialistas para repasar el patrimonio subterráneo y prehistórico del concejo. El programa incluye tres conferencias que se sucederán a partir de las 17:30 horas y está organizado por la Casa Municipal de Cultura de Llanes y la Sociedad Espeleológica y Barranquista Escar, único club del Oriente de Asturias en su disciplina, que celebra este otoño el 20 aniversario de su constitución. La primera de las charlas, a las 17:30 h, correrá a cargo de Pablo Solares Villar, bajo el título \"S.E.B. Escar: 20 años de exploración espeleológica en Llanes\". Técnico Deportivo en Espeleología, lleva 35 años practicando esta disciplina, los veinte últimos en la Sociedad Espeleológica y Barranquista Escar, club que actualmente preside. Fue presidente de la Federación de Espeleología del Principado de Asturias durante dos mandatos (2009-2016) y, en la actualidad, vocal de su junta directiva como coordinador de la Comisión de Zonas de Exploración y Catálogo de Cavidades. En su intervención repasará, apoyado en imágenes, las grandes cavidades del concejo, todas aquellas cuevas y simas con más de un kilómetro de galerías o más de 100 metros de profundidad. A las 18:30 h será el turno de Borja González Rabanal, con la charla \"La Cueva de Ḥou Amieva y los últimos cazadores recolectores del Cuera\". Graduado en Historia por la Universidad de Oviedo (2013), completó el Máster en Prehistoria y Arqueología de la Universidad de Cantabria (2014) y es doctor en Arqueología Prehistórica por las universidades de Cantabria y Autónoma de Barcelona. Ha sido investigador predoctoral FPI en la Universidad de Cantabria (2018-2022) y postdoctoral Juan de la Cierva en la Universidad de Valladolid (2024-2025); en la actualidad es investigador postdoctoral Margarita Salas del Gobierno de Asturias en la Universidad de Oviedo y la Universidad de Roma La Sapienza. Sus líneas de investigación se centran en las estrategias de subsistencia, los patrones de asentamiento y los comportamientos simbólicos de los últimos cazadores-recolectores y las primeras comunidades agrícolas del norte peninsular, con especial atención a la bioarqueología aplicada a contextos funerarios. En su conferencia presentará los resultados de los primeros trabajos de excavación en la Cueva de Ḥou Amieva (Villa, Llanes), que señalan un yacimiento de edad mesolítica vinculado a los últimos cazadores recolectores de la Península Ibérica. Cerrará la jornada, a las 19:30 h, Alberto Martínez Villa con \"El Paleolítico y las cuevas de Llanes\". Doctor en Historia y Arqueología (Arte Paleolítico) por la UNED y licenciado en Geografía e Historia por la Universidad de Oviedo, dirige el Centro Ecomuseo de la Fauna Glacial de Onís. Tras una primera etapa vinculada a la arqueología de gestión, su labor investigadora se ha centrado en los últimos años en el Paleolítico y el arte parietal del Oriente de Asturias. Ha dirigido y codirigido excavaciones y estudios en yacimientos como La Güelga, El Covarón, Les Pedroses, La Lloseta, o la Cuevona de Ardines, ha estudiado el arte rupestre de cavidades como Valmori, Mazaculos, Tebellín, Los Canes o El Covarón, y ha participado en proyectos internacionales de investigación prehistórica como CANTABRICOIS2, PrehMIND, PaleontheMove, First Art o PrECOmmunities. En su charla repasará de forma general algunas de las principales cuevas de Llanes con yacimientos arqueológicos o arte rupestre de edad paleolítica y su importancia en los estudios prehistóricos de la región. La entrada a esta jornada sobre espeleología y arqueología en Llanes es gratuita, siendo necesario reservar previamente a través de la página: https://casaculturallanes.eventbrite.com","days":[7],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cultura-llanes_2026-11-07_jornadas-de-espeleologia_page-0001.jpg?itok=hENFIwBx"],"source":"https://www.llanes.es/../es/jornadas-de-espeleologia-y-arqueologia-en-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes (1º planta)"},{"title":"Teatro: «Un ataúd para dos» (Porrúa)","text":"Centro Cultural Llacín (Porrúa) 19:00 Teatro: &quot;Un ataúd para dos&quot; (Porrúa) 19:00 h. En el Centro Cultural Llacín (Museo del Oriente - Porrúa), teatro dirigido por Cristina López del Hierro y protagonizado por Mercedes Álvarez, Tere Fernández, Julio Ruenes y Alberto Fernández: \"UN ATAÚD PARA DOS\". Entrada: 5 €. (Venta de entradas en el Centro Cultural Llacín 30 minutos antes de la función).","days":[],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/un_ataud_para_dos_porrua.jpg?itok=InSzqIhf","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/teatro_nueva.jpg?itok=nrMVtneV","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/muestra-asturiana-montana-porrua-2022jpg.jpg?itok=8TGC-uEf"],"source":"https://www.llanes.es/../es/teatro-un-ataud-para-dos-porrua","month":10,"place":"Centro Cultural Llacín (Porrúa)"},{"title":"Llanes en Danza: «El amor brujo» (Llanes)","text":"https://www.facebook.com/casaculturallanes Casino de Llanes 19:30 Llanes en Danza: &quot;El amor brujo&quot; (Llanes) El amor brujo · Llanes en Danza. Maribel Gallardo y Alberto San Quirico presentan un recital de castañuelas y piano dedicado a la música española y a su vínculo con la danza. Un recorrido por repertorios y épocas que llega al Casino de Llanes. Sábado 7 de noviembre · 19:30 h. Casino de Llanes Entrada gratuita. Reservas: https://casaculturallanes.eventbrite.com Más información en el enlace: https://tinyurl.com/5d7x3jtz","days":[7],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cultura-llanes_2026-11-07_el-amor-brujo_page-0001.jpg?itok=hfX6QQ6E"],"source":"https://www.llanes.es/../es/llanes-en-danza-el-amor-brujo-llanes","month":10,"place":"Casino de Llanes"},{"title":"Taller de Circle Singing (canto circular) en Llanes","text":"https://www.facebook.com/casaculturallanes Casino de Llanes 17:00 - 19:00 Taller de Circle Singing (canto circular) en Llanes ¿Te apetece probar el canto circular? El III Festival Teatro Total propone un taller de Circle Singing (canto circular) con Mónica Acevedo. Crearemos ritmos, melodías e improvisaciones con la voz, a partir de la escucha y el juego en grupo. No necesitas experiencia musical previa. Domingo 8 de noviembre, de 17:00 a 19:00 h. Casino de Llanes. Información e inscripciones: 646 371 472","days":[8],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_de_circle_8_nov.jpg?itok=LBzBlyxB","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/talleres_25n_0.jpg?itok=fIKpqWRP","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/talleres_25n.jpg?itok=zF27AVv2"],"source":"https://www.llanes.es/../es/taller-de-circle-singing-canto-circular-en-llanes","month":10,"place":"Casino de Llanes"},{"title":"Talleres gratuitos por el 25N (Llanes)","text":"Centro Asesor de la Mujer. Antiguo Hospital (Pancar) 16:00 - 18:00 Talleres gratuitos por el 25N (Llanes) Con motivo del Día Internacional de la Eliminación de la Violencia contra la Mujer, el Ayuntamiento de Llanes organiza este taller creativo dirigido a mujeres a partir de 16 años. Fechas disponibles: 10 de noviembre (Martes) | 16:00 a 18:00h | 5 plazas. 12 de noviembre (Jueves) | 10:30 a 14:00h | 8 plazas. 13 de noviembre (Viernes) | 10:30 a 14:00h | 8 plazas Lugar: Centro Asesor de la Mujer (Antiguo Hospital Pancar), Llanes. Inscripciones: 684 668 704 / 684 668 707.","days":[10,12,13],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/talleres_25n_0.jpg?itok=fIKpqWRP","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/talleres_25n.jpg?itok=zF27AVv2"],"source":"https:/ o se fugó con él. También evoca una cita con Byron en Suiza. Pero, sobre todo, rememora una noche de noviembre de 1816 durante la cual, mientras sus amigos contaban historias de terror, ella daba a luz al legendario monstruo de Frankenstein. Música Alejandro Massó Fotografía Carlos Suárez Compañías Ditirambo Films, Compañía Iberoamericana de TV, Viking Films Género Drama. Romance. Intriga | Siglo XIX Sinopsis Dos poetas ingleses, Mary Shelley y Lord Byron, se ven obligados a huir de Inglaterra. Durante el viaje, Mary recuerda cómo conoció en casa de su padre adoptivo al joven y apasionado poeta Shelley, cómo lo amó y cómo se fugó con él. También evoca una cita con Byron en Suiza. Pero, sobre todo, rememora una noche de noviembre de 1816 durante la cual, mientras sus amigos contaban historias de terror, ella daba a luz al legendario monstruo de Frankenstein.","days":[12],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/remando_al_viento_0.jpg?itok=xt1Py7sD","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/remando_al_viento.jpg?itok=TrC7ES_T","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W"],"source":"https://www.llanes.es/../es/ciclo-de-cine-gonzalo-suarez-remando-al-viento-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Taller Gratuito De Zumba Posada De Llanes","text":"Centro Cívico de Posada 19:30 - 20:30 Taller gratuito de Zumba (Posada de Llanes) A partir del jueves, 12 de noviembre, el Centro Cívico de Posada acoge un taller gratuito de Zumba, impartido por Diana Riestra. Estas clases son una mezcla de baile y fitness, aptas para todas las edades, y para todos los niveles de condición física. Para poder participar no es necesario saber bailar, ni tener experiencia previa. Las personas interesadas deberán comunicar su asistencia previamente por WhatsApp al número 684 661 092. Las clases, se impartirán de 19:30 a 20:30 horas, todos los jueves.","days":[12],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/taller_zumba_posada.jpeg?itok=ZTt0zt-D","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/v_encuentro_folclorico_posada_0.jpg?itok=TA_wJ1As","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/talleres_25n_0.jpg?itok=fIKpqWRP"],"source":"https://www.llanes.es/../es/taller-gratuito-de-zumba-posada-de-llanes","month":10,"place":"Centro Cívico de Posada"},{"title":"Actividad Infantil Por Que Los Pajaros No Tienen Rey Llanes","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:00 - 18:00 Actividad Infantil: &quot;¿Por qué los pájaros no tienen rey?&quot; (Llanes) ¡Noviembre llega a La Curuxa con nuevas aventuras! Con el otoño, el Centro cultural infantil de Llanes se llena de propuestas para crear, imaginar y experimentar. Habrá origami, un encuentro con los libros y las aves, cuentos viajeros, historias de Samhain y un laboratorio para descubrir las texturas y los aromas del bosque. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 3 a 10 años (consulta las edades de cada actividad). Inscripción gratuita en Eventbrite: https://casaculturallanes.eventbrite.com Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–20:30 Agenda de NOVIEMBRE Vie 6 · 17:00–18:00 — «Origami de Stitch» · 6 a 10 años. En este taller jugaremos con el papel para crear figuras de Stitch que luego podremos usar para decorar libros, libretas o nuestra habitación. Vie 13 · 17:00–18:00 — «¿Por qué los pájaros no tienen rey?», con David Acera · 6 a 10 años. David Acera presenta su libro en un encuentro familiar que combina literatura y ornitología. El autor comparte cómo nació la obra e invita a observar de otra manera las aves que nos rodean en pueblos y ciudades. Sáb 14 · 17:00–18:00 — «Cuentos de maleta», con Letibú · 6 a 10 años. Vie 20 · 17:00–18:00 — «Cuentos de Samhain» · 3 a 6 años. Vie 27 · 17:00–18:00 — «Laboratorio sensorial» · 3 a 6 años.","days":[6],"images":[],"source":"https://www.llanes.es/../es/actividad-infantil-por-que-los-pajaros-no-tienen-rey-llanes","month":10,"place":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes)"},{"title":"Haciendo Pueblo Cortines Calduenu","text":"https://www.facebook.com/profile.php?id=61575979692953 Escuelas de Cortines (Caldueñu) 19:00 Haciendo pueblo (Cortines - Caldueñu) Seguimos haciendo pueblo. Desde la Asociación Vecinal Valcabreru queremos seguir creando espacios para encontrarnos, compartir y disfrutar de pequeños momentos juntos. Por eso, os proponemos una tarde diferente, con fotografía, cine y un rato de convivencia para terminar compartiendo algo de comer. Porque también en invierno apetece reunirse, charlar, compartir y mantener vivo ese espíritu de comunidad que hace especiales nuestros pueblos. Y para que nuestra espicha sea aún más especial, os animamos a colaborar trayendo algo de comida para compartir: un poco de embutido, queso, tortilla, empanada, algo dulce… ¡Cualquier aportación será bienvenida! ¿DÓNDE? Donde siempre, en las escuelas nuevas de Cortines. FECHA: Viernes, 13 de noviembre. HORA: A partir de las 19:00 horas. Os esperamos con ganas de vernos y pasar un buen rato entre vecinos. ¡Animaos a participar! PROGRAMA 19:00 h. Exposición de fotos \"DONDE YA NO HABITO\". 19:30 h. Proyección del documental \"LA MAGIA DE LA MADRE TIERRA\" y un breve vídeo de El Mazucu. 20:00 h. Espicha para todos los asistentes. Organiza: Asociación Vecinal Valcabreru.","days":[13],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/viernes_13_calduenu.jpg?itok=aeMMAsV8","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/juega_pueblos_pria.jpg?itok=zEtmEK9W"],"source":"https://www.llanes.es/../es/haciendo-pueblo-cortines-calduenu","month":10,"place":"Escuelas de Cortines (Caldueñu)"},{"title":"Concierto Si Beethoven Fuera Asturianu Llanes","text":"Casino de Llanes 19:30 Concierto: &quot;Si Beethoven fuera asturianu&quot; (Llanes) Si Beethoven fuera asturianu d’Ensemble L’ArcaCasino de Llanes, 13/11/2026 - 19:30Dirixío a: públicu adulto Duración: 60 minutos Entrada gratuita. Reservas: https://casaculturallanes.eventbrite.com Ensemble L’Arca reinterpreta melodías tradicionales asturianas junto a obras clásicas, con música y humor. Si Beethoven fuera asturianu, de Ensemble L’Arca, propone un cruce entre grandes obras de música clásica y melodías de la tradición asturiana. ¿Y si Vivaldi hubiera conocido el Xiringüelu o Mozart el Pericote? Un concierto de música, historia y humor. Programa de Asturies, Cultura en Rede · Cultura Sidrera.","days":[13],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/si_beethoven_fuera_asturianu.jpg?itok=ija2c4Gp","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_los_ruidos.jpeg?itok=M0REcdTv","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_en_porrua_0.png?itok=fcnbA9eT"],"source":"https://www.llanes.es/../es/concierto-si-beethoven-fuera-asturianu-llanes","month":10,"place":"Casino de Llanes"},{"title":"Torneo Otono Ayuntamiento De Llanes 1","text":"GOLF MUNICIPAL DE LLANES 14 Noviembre 2026 TORNEO OTOÑO AYUNTAMIENTO DE LLANES SABADO 14 DE NOVIEMBRE INDIVIDUAL/STABLEFORD APERTURA INSCRIPCIONES: 6 DE NOVIEMBRE 2026 CIERRE DE INSCRIPCIONES:10:00H DEL VIERNES 13 DE NOVIEMBRE Información adicional cartel_torneo_otono_2.pdf","days":[14],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cartel_torneo_otono_2_page-0001_21.jpg?itok=yAXwlvw8"],"source":"https://www.llanes.es/../es/torneo-otono-ayuntamiento-de-llanes-1","month":10,"place":"GOLF MUNICIPAL DE LLANES"},{"title":"Fiesta De San Roman Cue 1","text":"https://www.facebook.com/profile.php?id=100076995440480 Cué (Llanes) 14 Noviembre 2026 Fiesta de San Román (Cué) SÁBADO 14 13:00 h. Sesión vermouth. 15:00 h. Paella. 17:00 h. Comenzamos a mayar la manzana con la degustación de sidra dulce. A partir de las 20:00 h. GRAN AMAGÜESTU. 21:00 h. GRAN PARRILLADA. ROMERÍA y VERBENA con: ETHAN MERÉ y DJ ABEL. BAR de la comisión con pinchos y CARPA. Horarios de las descargas de pirotecnia que se efectuarán el sábado 14 de noviembre: 09:00 h, 1/2 docena de voladores. 12:00 h, 1/2 docena de voladores. 14:00 h, 1/2 docenas de voladores. 17:00 h, 1/2 docenas de voladores.","days":[14],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/san_roman_cue_6.jpg?itok=P1dqpAh8"],"source":"https://www.llanes.es/../es/fiesta-de-san-roman-cue-1","month":10,"place":"Cué (Llanes)"},{"title":"Actividad Infantil Cuentos De Maleta Llanes","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:00 - 18:00 Actividad Infantil: &quot;Cuentos de maleta&quot; (Llanes) ¡Noviembre llega a La Curuxa con nuevas aventuras! Con el otoño, el Centro cultural infantil de Llanes se llena de propuestas para crear, imaginar y experimentar. Habrá origami, un encuentro con los libros y las aves, cuentos viajeros, historias de Samhain y un laboratorio para descubrir las texturas y los aromas del bosque. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 3 a 10 años (consulta las edades de cada actividad). Inscripción gratuita en Eventbrite: https://casaculturallanes.eventbrite.com Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–20:30 Agenda de NOVIEMBRE Vie 6 · 17:00–18:00 — «Origami de Stitch» · 6 a 10 años. En este taller jugaremos con el papel para crear figuras de Stitch que luego podremos usar para decorar libros, libretas o nuestra habitación. Vie 13 · 17:00–18:00 — «¿Por qué los pájaros no tienen rey?», con David Acera · 6 a 10 años. Sáb 14 · 17:00–18:00 — «Cuentos de maleta», con Letibú · 6 a 10 años. Con música, objetos y personajes, Letibú convierte cada cuento en una experiencia compartida. La narración se acompaña de pequeñas representaciones que dan vida a distintos momentos de la historia. Los relatos se enriquecen con improvisaciones y aportaciones del público. Vie 20 · 17:00–18:00 — «Cuentos de Samhain» · 3 a 6 años. Vie 27 · 17:00–18:00 — «Laboratorio sensorial» · 3 a 6 años.","days":[6],"images":[],"source":"https://www.llanes.es/../es/actividad-infantil-cuentos-de-maleta-llanes","month":10,"place":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes)"},{"title":"Teatro Un Ataud Para Dos Nueva De Llanes","text":"Casa Cultura del Valle de San Jorge (Nueva) 19:00 Teatro: &quot;Un ataúd para dos&quot; (Nueva de Llanes) SÁBADO 14 a las 19:00: TEATRO. “Un ataúd para dos”, dirigida por Cristina López del Hierro y protagonizada por Mercedes Álvarez, Tere Fernández, Julio Ruenes y Alberto Fernández. Disfrutaremos de la comedia teatral de humor negro: “Un ataúd para dos”, del dramaturgo francés de origen español Jean Pierre Martínez. Se trata de una obra políticamente incorrecta, donde la muerte se mezcla con el humor más ácido. Entrada libre hasta completar aforo.","days":[14],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/un_ataud_para_dos_porrua.jpg?itok=InSzqIhf","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/teatro_nueva.jpg?itok=nrMVtneV"],"source":"https://www.llanes.es/../es/teatro-un-ataud-para-dos-nueva-de-llanes","month":10,"place":"Casa Cultura del Valle de San Jorge (Nueva)"},{"title":"Concierto Los Ruidos Llanes","text":"Casino de Llanes 19:30 Concierto: &quot;Los Ruidos&quot; (Llanes) Los Ruidos, en directo en Llanes. Formados en Asturias en los años ochenta, Los Ruidos están liderados por Juan Martínez, que fue miembro de Madson y es hermano de Jorge Martínez, líder de Ilegales. Con una identidad propia, la banda mezcla rock, punk, surf y psicodelia, con ironía y espíritu gamberro. Siguen en activo y fieles a su particular manera de entender el rock. Sábado 14 de noviembre · 19:30 h. Casino de Llanes. Entrada gratuita. Reservas: https://casaculturallanes.eventbrite.com","days":[14],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_los_ruidos.jpeg?itok=M0REcdTv","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_en_porrua_0.png?itok=fcnbA9eT"],"source":"https://www.llanes.es/../es/concierto-los-ruidos-llanes","month":10,"place":"Casino de Llanes"},{"title":"Estreno Digital Del Videojuego Al Cine","text":"Llanes Todo el día Estreno digital: &quot;Del videojuego al cine&quot; El 15 de noviembre se estrenará digitalmente «Del videojuego al cine», un episodio especial del pódcast El Videoclub de los 80 preparado para Llanes Game. Un recorrido por las adaptaciones cinematográficas de videojuegos nacidos en los años ochenta, desde las primeras versiones hasta producciones recientes.","days":[15],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/estreno-digital-del-videojuego-al-cine","month":10},{"title":"Ciclo De Cine Gonzalo Suarez Ditirambo Llanes","text":"Casa Municipal de Cultura de Llanes 19:00 Ciclo de Cine Gonzalo Suárez: &quot;Ditirambo&quot; (Llanes) DITIRAMBO· Ciclo de Cine Gonzalo Suárez (1934-2026) Miércoles 18 de noviembre - 19:00 h. Casa de Cultura de Llanes Entrada gratuita. Reserva en: https://casaculturallanes.eventbrite.com Título original: Ditirambo Año: 1969 Duración: 90 min. Dirección y Guión: Gonzalo Suárez Reparto: Gonzalo Suárez, Yelena Samarina, Charo López... Género: Comedia. Drama Sinopsis: Ditirambo es un héroe atípico que no sonríe nunca, dice siempre la verdad y lleva a cabo de forma implacable cuantas misiones le encomiendan. La viuda de un escritor le encarga que localice a la antigua amante de su marido con el propósito de vengarse de ella. Así se desencadenan los acontecimientos tragicómicos que conducirán a un final imprevisible","days":[18],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/ditirambo-739346085-large.jpg?itok=fXwvmYdr","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/ciclo-de-cine-gonzalo-suarez-ditirambo-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Ciclo De Cine Gonzalo Suarez El Detective Y La Muerte Llanes","text":"Casa Municipal de Cultura de Llanes 19:00 Ciclo de Cine Gonzalo Suárez: &quot;El detective y la muerte&quot; (Llanes) EL DETECTIVE Y LA MUERTE· Ciclo de Cine Gonzalo Suárez (1934-2026) Jueves 19 de noviembre - 19:00 h. Casa de Cultura de Llanes Entrada gratuita. Reserva en: https://casaculturallanes.eventbrite.com Título original: El detective y la muerte Año: 1994 Duración: 114 min. País: España Dirección: Gonzalo Suárez Guion: Gonzalo Suárez, Azucena Rodríguez. Cuento: Hans Christian Andersen Reparto: Javier bardem, Carmelo Gómez, María de Madeiros, Héctor Alterio, Charo López, Mapi Galán, Francis Lorenzo... Música: Suso Sáiz Fotografía: Carlos Suárez Compañías: Lolafilms, Rocabruno Género: Cine negro. Thriller. Intriga Grupos: Adaptaciones de Hans Christian Andersen Sinopsis: En una ciudad europea agitada por disturbios raciales, un poderoso magnate debe enfrentarse al único poder que no podrá engañar ni corromper: la muerte. Por otra parte, un detective trata de encontrar a la mujer que ama, y, al mismo tiempo, una inocente joven lo sigue con el disparatado propósito de devolverle la vida a su hijo, que ha sido asesinado en la cuna por un pistolero.","days":[19],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/el_detective_y_la_muerte-779183798-large.jpg?itok=0vG9nRP-","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/ciclo-de-cine-gonzalo-suarez-el-detective-y-la-muerte-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Actividad Infantil Cuentos De Samhain Llanes","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:00 - 18:00 Actividad Infantil: &quot;Cuentos de Samhain&quot; (Llanes) ¡Noviembre llega a La Curuxa con nuevas aventuras! Con el otoño, el Centro cultural infantil de Llanes se llena de propuestas para crear, imaginar y experimentar. Habrá origami, un encuentro con los libros y las aves, cuentos viajeros, historias de Samhain y un laboratorio para descubrir las texturas y los aromas del bosque. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 3 a 10 años (consulta las edades de cada actividad). Inscripción gratuita en Eventbrite: https://casaculturallanes.eventbrite.com Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–20:30 Agenda de NOVIEMBRE Vie 6 · 17:00–18:00 — «Origami de Stitch» · 6 a 10 años. En este taller jugaremos con el papel para crear figuras de Stitch que luego podremos usar para decorar libros, libretas o nuestra habitación. Vie 13 · 17:00–18:00 — «¿Por qué los pájaros no tienen rey?», con David Acera · 6 a 10 años. Sáb 14 · 17:00–18:00 — «Cuentos de maleta», con Letibú · 6 a 10 años. Vie 20 · 17:00–18:00 — «Cuentos de Samhain» · 3 a 6 años. Vie 27 · 17:00–18:00 — «Laboratorio sensorial» · 3 a 6 años.","days":[6],"images":[],"source":"https://www.llanes.es/../es/actividad-infantil-cuentos-de-samhain-llanes","month":10,"place":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes)"},{"title":"Cine La Placa Una Familia De Bien Llanes","text":"Casa Municipal de Cultura de Llanes 19:00 Cine: &quot;La placa, una familia de bien&quot; (Llanes) Viernes 20 de noviembre - 19:00 h. Casa de Cultura de Llanes Entrada gratuita. Reserva en: https://casaculturallanes.eventbrite.com Dirección: José Antonio Quirós Guion: Olga Menéndez, José Antonio Quirós Año: 2025 Duración: 80 min Idioma: español Más información: www.laboralcinemateca.es Tras la muerte prematura de Jenny Gutwirth, una familia de élite se quiebra. La enigmática placa que la recuerda en un monte asturiano se convierte en el símbolo de un amor idealizado… o de una obsesión destructiva. Catherine y Marianne, sus hijas, crecen divididas por silencios, secretos y el peso de un padre que intenta imponer su versión de la verdad. Ya adultas, deberán enfrentarse a un legado marcado por el exilio, la ruina y un trauma familiar que atraviesa generaciones. Información adicional: Festival Internacional de Cine de Gijón/Xixón FICX 2025. La programación cinematográfica ofrecida por La Cinemateca Ambulante está seleccionada por el Festival Internacional de Cine de Gijón/Xixón (Divertia Gijón S.A.).","days":[20],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/la_placa.jpg?itok=9wpy3pos","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/cine-la-placa-una-familia-de-bien-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Mercadillo De Navidad Nueva De Llanes","text":"Polideportivo de Nueva de Llanes 21 Noviembre 2026 - 22 Noviembre 2026 10:00 - 20:30 h. Mercadillo de Navidad (Nueva de Llanes) 21 y 22 de noviembre de 2026 El Valle de San Jorge se prepara para dar la bienvenida a la Navidad con un mercadillo navideño, que se celebra los días 21 y 22 de noviembre en Nueva de Llanes. Ubicación: Polideportivo de Nueva de Llanes. Horario: 10:00 - 20:30 h. Actividades: Puestos de artesanía Dulces Actividades para niños Villancicos Cuentacuentos SÁBADO De 12:00 a 13:30 h. Pintacaras 18:00 h. Cuentacuentos DOMINGO De 12:00 a 13:30 h. Pintacaras ORGANIZA: Asociación de emprendedores del Valle de San Jorge Colabora: Ayuntamiento de Llanes","days":[21,22],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/mercadillo_de_navidad_nueva.jpg?itok=LUzNppIm"],"source":"https://www.llanes.es/../es/mercadillo-de-navidad-nueva-de-llanes","month":10,"place":"Polideportivo de Nueva de Llanes"},{"title":"Xxx Muestra Exposicion De La Raza Asturiana De La Montana Y Feria De Toda Clase De Ganado Porrua","text":"Porrúa (Llanes) 21 Noviembre 2026 - 22 Noviembre 2026 XXX Muestra Exposición de la Raza Asturiana de la Montaña y Feria de toda clase de ganado (Porrúa) El fin de semana del 21 y 22 de noviembre la localidad llanisca de Porrúa se convertirá en el centro ganadero de la comarca del Oriente de Asturias. El sábado 21 tendrá lugar la XXX MUESTRA EXPOSICION DE LA RAZA ASTURIANA DE LA MONTAÑA. El domingo 22, se celebrará la FERIA GANADERA SANTA MARGARITA de toda clase de ganado.","days":[21,22],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/muestra-asturiana-montana-porrua-2022jpg.jpg?itok=8TGC-uEf","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/un_ataud_para_dos_porrua.jpg?itok=InSzqIhf","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/feria_san_martin_nueva.jpg?itok=vjviU7L4"],"source":"https://www.llanes.es/../es/xxx-muestra-exposicion-de-la-raza-asturiana-de-la-montana-y-feria-de-toda-clase-de-ganado-porrua","month":10,"place":"Porrúa (Llanes)"},{"title":"Juega Pueblos Pria","text":"https://www.facebook.com/PlanInfanciaLlanes Área Recreativa de Garaña 11:00 Juega Pueblos (Pría) Vuelven los Juega Pueblos del Plan de infancia Llanes. En esta ocasión a Pría, donde todos los pueblos de la parroquia se unen para esta jornada. Lugar: Área Recreativa de Garaña. Fecha: 21 de noviembre. Hora: 11:00 h. Inscripciones a través del formulario: https://forms.gle/cvoqxFbS848LwYhKA","days":[21],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/juega_pueblos_pria.jpg?itok=zEtmEK9W"],"source":"https://www.llanes.es/../es/juega-pueblos-pria","month":10,"place":"Área Recreativa de Garaña"},{"title":"Cuentacuentos El Copo De Nieve Nueva De Llanes","text":"Casa Cultura del Valle de San Jorge (Nueva) 18:00 Cuentacuentos: &quot;El copo de nieve&quot; (Nueva de Llanes) SÁBADO 21 a las 18:00; CUENTACUENTOS “El copo de nieve” de Elisabet Martín. (Polideportivo de Nueva. Mercadillo navideño) Historias maravillosas sobre muñecos de nieve de gran corazón, fríos vientos del norte que crean una blanca Navidad, liebres bailongas dispuestas a pasarlo bomba en el baile de fin de año y varias sorpresas más. ¡Ven a disfrutar con la magia de estas historias de Navidad!","days":[21],"images":[],"source":"https://www.llanes.es/../es/cuentacuentos-el-copo-de-nieve-nueva-de-llanes","month":10,"place":"Casa Cultura del Valle de San Jorge (Nueva)"},{"title":"Concierto Diagnostico Binario Llanes","text":"Casino de Llanes 19:30 Concierto: &quot;Diagnóstico Binario&quot; (Llanes) Indie pop / Rock alternativo Sábado 21 de noviembre de 2026, 19:30 h. Lugar: Casino de Llanes, Calle Castillo, 3, Llanes Entrada gratuita. Reservas: https://casaculturallanes.eventbrite.com La formación alicantina Diagnóstico Binario regresa a los escenarios para presentar en directo \"Sinapsis\", su segundo y ambicioso trabajo discográfico. Tras consolidarse como una de las propuestas más sólidas del pop-rock alternativo, la banda da un paso hacia una madurez sonora en la que potencia y sensibilidad melódica convergen. \"Sinapsis\" representa una evolución conceptual, explorando las conexiones humanas a través de letras introspectivas y una producción envolvente. Este concierto no es solo una presentación de álbum, sino una experiencia diseñada para vibrar con la energía característica de su directo. No pierdas la oportunidad de formar parte de este punto de inflexión. Una cita imprescindible para los amantes de la música con identidad propia.","days":[21],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/diagnostico.jpg?itok=8JWg3vWa","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_los_ruidos.jpeg?itok=M0REcdTv","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_en_porrua_0.png?itok=fcnbA9eT"],"source":"https://www.llanes.es/../es/concierto-diagnostico-binario-llanes","month":10,"place":"Casino de Llanes"},{"title":"Curso De Utilizacion Del Opac Nueva De Llanes 4","text":"Casa Cultura del Valle de San Jorge (Nueva) 19:00 Curso de utilización del OPAC (Nueva de Llanes) MIÉRCOLES 25 a las 19:00; FORMACIÓN DE USUARIOS. Curso de utilización del OPAC (Catálogo en línea para bibliotecas). Aprende a utilizar el catálogo en línea de la red de bibliotecas del Principado de Asturias. Podrás realizar búsquedas simples, avanzadas, a catálogo completo o en una biblioteca concreta de la red. Aprenderás a realizar reservas y renovaciones sin tener que acudir físicamente a la biblioteca. Para esta actividad es imprescindible la inscripción previa. (5 personas). Inscripciones: culturanueva@ayuntamientodellanes.com / 985410106","days":[25],"images":[],"source":"https://www.llanes.es/../es/curso-de-utilizacion-del-opac-nueva-de-llanes-4","month":10,"place":"Casa Cultura del Valle de San Jorge (Nueva)"},{"title":"Ciclo De Cine Gonzalo Suarez Epilogo Llanes","text":"Casa Municipal de Cultura de Llanes 19:00 Ciclo de Cine Gonzalo Suárez: &quot;Epílogo&quot; (Llanes) Epílogo· Ciclo de Cine Gonzalo Suárez (1934-2026) Jueves 26 de noviembre - 19:00 h. Casa de Cultura de Llanes Entrada gratuita. Reserva en: https://casaculturallanes.eventbrite.com Título original: Epílogo Año: 1984 Duración: 91 min. País: España Dirección: Gonzalo Suárez Guion: Gonzalo Suárez, Miguel Ángel Barbero, Joan Potau. Argumento: Gonzalo Suárez Reparto: Charo López, José Sacristán, Francisco Rabal, Manuel Zarzo, Sandra Toral... Música: Juan José García Caffi Fotografía: Carlos Suárez Compañías: Ditirambo Films, Salamandra P.C, RTVE Género: Drama Sinopsis: Durante muchos años Rocabruno y Ditirambo firmaban conjuntamente sus novelas, trabajaban juntos y estaban enamorados de la misma mujer, pero llegó un momento en que se separaron. Diez años después, Ditirambo visita a Rocabruno con la intención de que escriban juntos su última novela, ''Epílogo''.","days":[26],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/epilogo-199561594-large.jpg?itok=z7YkreUA","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/ciclo-de-cine-gonzalo-suarez-epilogo-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Actividad Infantil Laboratorio Sensorial Llanes","text":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes) 17:00 - 18:00 Actividad Infantil: &quot;Laboratorio sensorial&quot; (Llanes) ¡Noviembre llega a La Curuxa con nuevas aventuras! Con el otoño, el Centro cultural infantil de Llanes se llena de propuestas para crear, imaginar y experimentar. Habrá origami, un encuentro con los libros y las aves, cuentos viajeros, historias de Samhain y un laboratorio para descubrir las texturas y los aromas del bosque. Planta baja de la Biblioteca Municipal de Llanes. Actividades para niñas y niños de 3 a 10 años (consulta las edades de cada actividad). Inscripción gratuita en Eventbrite: https://casaculturallanes.eventbrite.com Más información: 984 84 31 02 · L–V 10:00–14:00 y 15:30–20:30 Agenda de NOVIEMBRE Vie 6 · 17:00–18:00 — «Origami de Stitch» · 6 a 10 años. En este taller jugaremos con el papel para crear figuras de Stitch que luego podremos usar para decorar libros, libretas o nuestra habitación. Vie 13 · 17:00–18:00 — «¿Por qué los pájaros no tienen rey?», con David Acera · 6 a 10 años. Sáb 14 · 17:00–18:00 — «Cuentos de maleta», con Letibú · 6 a 10 años. Vie 20 · 17:00–18:00 — «Cuentos de Samhain» · 3 a 6 años. Vie 27 · 17:00–18:00 — «Laboratorio sensorial» · 3 a 6 años.","days":[6],"images":[],"source":"https://www.llanes.es/../es/actividad-infantil-laboratorio-sensorial-llanes","month":10,"place":"Centro Cultural Infantil “La Curuxa”. (Planta baja de la Biblioteca Municipal de Llanes)"},{"title":"Cine Plaza Mayor Llanes","text":"Casa Municipal de Cultura de Llanes 19:00 Cine:: &quot;Plaza Mayor&quot; (Llanes) Viernes 27 de noviembre - 19:00 h. Casa de Cultura de Llanes Entrada gratuita. Reserva en: https://casaculturallanes.eventbrite.com Título original: Plaza Mayor Año: 2025 Duración: 78 min. País: España Dirección: Marcos M. Merino Guion: Marta F. Crestelo Género: Documental Sinopsis: Retrato íntimo de una ciudad que ya no existe y de otra que todavía está en construcción. A través de las celebraciones, las protestas, los gestos cotidianos y las imágenes del pasado, la película recorre la transformación de Gijón: de ciudad industrial a destino turístico, de plaza de lucha a escenario de espectáculo. Frente a esta transformación, el autor regresa a la plaza de su infancia y se pregunta por la memoria colectiva: ¿quién la construye?, ¿qué se olvida?, ¿qué queda fuera del encuadre?","days":[27],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/plaza_mayor-944984956-large.jpg?itok=XEOSFxJB","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_domestico_5_nov.jpg?itok=XqfcIN0W","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/cine_6_nov_nueva.jpg?itok=KwHuIxpw"],"source":"https://www.llanes.es/../es/cine-plaza-mayor-llanes","month":10,"place":"Casa Municipal de Cultura de Llanes"},{"title":"Concierto Buir Llanes","text":"Casino de Llanes 19:30 Concierto: &quot;Buir&quot; (Llanes) Concierto de Buir (música tradicional asturiana) con Xosé Ambás, Pepín de Muñalén y Vero Rubio en Casino de Llanes, el sábado, 28 de noviembre de 2026 a las 19:30 h. «Buir», propuesta de cultura tradicional dirigida a público familiar del programa Asturies, Cultura en Rede del Principado. Entrada gratuita. Reservas: https://casaculturallanes.eventbrite.com","days":[28],"images":["https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_los_ruidos.jpeg?itok=M0REcdTv","https://www.llanes.es/sites/llanes/files/styles/agenda_mensual/public/concierto_en_porrua_0.png?itok=fcnbA9eT"],"source":"https://www.llanes.es/../es/concierto-buir-llanes","month":10,"place":"Casino de Llanes"}];const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1);let selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];document.getElementById('todayLabel').textContent='Hoy · '+new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(now);function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function paint(){document.getElementById('month').textContent=months[view.getMonth()]+' '+view.getFullYear();const grid=document.getElementById('days');grid.innerHTML='';const offset=(new Date(view.getFullYear(),view.getMonth(),1).getDay()+6)%7,total=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),prevTotal=new Date(view.getFullYear(),view.getMonth(),0).getDate();for(let i=0;i<42;i++){let day,month=view.getMonth(),year=view.getFullYear(),muted=false;if(i<offset){day=prevTotal-offset+i+1;month--;muted=true;if(month<0){month=11;year--}}else if(i>=offset+total){day=i-offset-total+1;month++;muted=true;if(month>11){month=0;year++}}else day=i-offset+1;const b=document.createElement('button');b.className='day'+(muted?' muted':'');if(key(year,month,day)===key(now.getFullYear(),now.getMonth(),now.getDate()))b.classList.add('today');if(key(year,month,day)===key(selected.getFullYear(),selected.getMonth(),selected.getDate()))b.classList.add('selected');if(EVENTS.some(e=>e.days.includes(day)&&year===2026&&(e.month??9)===month))b.classList.add('has');b.textContent=day;b.setAttribute('aria-label',`${day} ${months[month]} ${year}`);b.onclick=()=>{selected=new Date(year,month,day);if(month!==view.getMonth()||year!==view.getFullYear())view=new Date(year,month,1);paint();showEvents()};grid.appendChild(b)}}function showEvents(){const label=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(selected);document.getElementById('selectedLabel').textContent=label[0].toUpperCase()+label.slice(1);const found=EVENTS.filter(e=>selected.getFullYear()===2026&&(e.month??9)===selected.getMonth()&&e.days.includes(selected.getDate()));document.getElementById('count').textContent=found.length?`${found.length} evento${found.length===1?'':'s'}`:'';const root=document.getElementById('events');root.innerHTML='';if(!found.length){root.innerHTML='<div class="empty"><strong>No hay eventos registrados para esta fecha.</strong>Prueba otra fecha del calendario.</div>';return}for(const e of found){const card=document.createElement('article');card.className='event';const title=document.createElement('h3');title.textContent=e.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=e.schedule|| (e.days.length>1?`Evento · ${e.days.join(', ')} de ${months[e.month??9]}`:'Evento de la agenda');const desc=document.createElement('p');desc.className='desc';desc.textContent=e.text;card.append(title,meta);if(e.place){const place=document.createElement('div');place.className='meta';place.textContent=e.place;card.appendChild(place)}card.appendChild(desc);if(e.images.length){const gallery=document.createElement('div');gallery.className='gallery';e.images.forEach((src,i)=>{const a=document.createElement('a');a.href=src;a.target='_blank';a.rel='noopener';a.setAttribute('aria-label','Abrir fotografía '+(i+1));const img=document.createElement('img');img.src=src;img.alt=e.title+' · fotografía '+(i+1);img.loading='lazy';a.appendChild(img);gallery.appendChild(a)});card.appendChild(gallery)}const link=document.createElement('a');link.className='source';link.href=e.source;link.target='_blank';link.rel='noopener';link.textContent='Ver ficha original ↗';card.appendChild(link);root.appendChild(card)}}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);paint()};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);paint()};paint();showEvents();
</script></body></html>
