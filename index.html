<style>
  :root{
    --bg:#060a12;
    --bg2:#0b1220;
    --panel:#0e1626;
    --cyan:#00f0ff;
    --magenta:#ff2fd0;
    --amber:#ffb020;
    --green:#33ffb0;
    --violet:#a463ff;
    --text:#dce8f5;
    --text-dim:#7f93ab;
    --line:rgba(0,240,255,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; overscroll-behavior-y:none;}

  /* ---------- fondo ---------- */
  body{
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(0,240,255,.10), transparent 60%),
      radial-gradient(ellipse 100% 50% at 90% 110%, rgba(255,47,208,.08), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(0,240,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,.035) 1px, transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(ellipse 80% 80% at 50% 40%, black 40%, transparent 90%);
  }

  /* ---------- cabecera fija ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:30;
    padding:14px 18px 12px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, rgba(6,10,18,.92) 60%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex; flex-direction:column; line-height:1;}
  .brand b{
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:15px;
    letter-spacing:.14em; color:var(--cyan);
    text-shadow:0 0 12px rgba(0,240,255,.55);
  }
  .brand span{font-size:10px; letter-spacing:.3em; color:var(--text-dim); margin-top:3px;}
  .counter{
    font-family:'Orbitron',sans-serif; font-size:11px; color:var(--magenta);
    border:1px solid rgba(255,47,208,.4); border-radius:20px;
    padding:5px 11px; letter-spacing:.05em;
    background:rgba(255,47,208,.06);
    white-space:nowrap;
  }

  /* ---------- barra de categorías ---------- */
  .filters{
    position:fixed; top:56px; left:0; right:0; z-index:29;
    display:flex; gap:8px; overflow-x:auto; padding:6px 16px 12px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12.5px;
    letter-spacing:.04em; color:var(--text-dim);
    border:1px solid var(--line); border-radius:20px;
    padding:6px 13px; background:rgba(9,15,26,.7); backdrop-filter:blur(4px);
    white-space:nowrap; cursor:pointer; transition:.15s;
  }
  .chip.active{color:#06131a; background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 16px rgba(0,240,255,.5);}

  /* ---------- progreso vertical ---------- */
  .progress{
    position:fixed; right:6px; top:112px; bottom:16px; width:3px; z-index:25;
    background:rgba(255,255,255,.06); border-radius:3px; overflow:hidden;
  }
  .progress i{
    display:block; width:100%; background:linear-gradient(180deg,var(--cyan),var(--magenta));
    border-radius:3px; transition:height .25s ease;
  }

  /* ---------- feed ---------- */
  #feed{
    position:relative; z-index:1;
    height:100vh; height:100dvh;
    overflow-y:auto; scroll-snap-type:y mandatory;
    padding-top:0;
  }
  .card{
    scroll-snap-align:start; scroll-snap-stop:always;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:104px 16px 34px;
    border-bottom:1px solid rgba(255,255,255,.05);
    position:relative;
  }
  .card.today{background:linear-gradient(180deg, rgba(255,47,208,.07), transparent 40%);}

  .date-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .date-badge{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:.06em; color:var(--bg);
    background:linear-gradient(90deg,var(--cyan),#7cf7ff);
    padding:8px 14px; border-radius:8px 2px 8px 2px;
    box-shadow:0 0 18px rgba(0,240,255,.45);
  }
  .date-badge.range{background:linear-gradient(90deg,var(--magenta),#ff8fe6);
    box-shadow:0 0 18px rgba(255,47,208,.45);}
  .today-tag{
    font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:.15em;
    color:var(--bg); background:var(--amber); padding:5px 9px; border-radius:4px;
    box-shadow:0 0 14px rgba(255,176,32,.6);
  }

  .photo-wrap{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:14px;
    overflow:hidden; margin-bottom:16px;
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.03);
    background:linear-gradient(135deg, var(--panel), #060a12);
  }
  .photo-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-wrap::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(6,10,18,.85) 100%);
    pointer-events:none;
  }
  .cat-tag{
    position:absolute; left:10px; bottom:10px; z-index:2;
    font-family:'Orbitron',sans-serif; font-size:10px; letter-spacing:.1em;
    padding:6px 11px; border-radius:5px; color:#06131a; font-weight:700;
  }
  .no-photo{
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    color:var(--text-dim); font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:.15em;
  }
  .no-photo svg{opacity:.35;}

  h2{
    font-family:'Orbitron',sans-serif; font-weight:700; font-size:19px; line-height:1.28;
    margin:0 0 4px; color:#fff; letter-spacing:.01em;
  }
  .place{
    font-size:14px; color:var(--cyan); font-weight:600; letter-spacing:.02em;
    margin-bottom:12px; display:flex; align-items:center; gap:6px;
  }
  .place::before{content:"◈"; font-size:11px;}

  .desc{
    font-size:15.5px; line-height:1.56; color:var(--text);
    flex:1; overflow-y:auto; padding-right:2px; padding-bottom:6px;
  }
  .desc p{margin:0 0 10px;}
  .desc::-webkit-scrollbar{width:3px;}
  .desc::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .swipe-hint{
    position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
    font-family:'Orbitron',sans-serif; font-size:9.5px; letter-spacing:.2em; color:var(--text-dim);
    display:flex; flex-direction:column; align-items:center; gap:3px; opacity:.7;
  }
  .swipe-hint svg{animation:bob 1.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}

  #empty{
    height:100vh; height:100dvh; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; padding:0 30px; text-align:center;
  }
  #empty b{font-family:'Orbitron',sans-serif; color:var(--cyan); letter-spacing:.08em; font-size:15px;}
  #empty span{color:var(--text-dim); font-size:14px;}

  @media (min-width:640px){
    .card{align-items:center;}
    .card > *{max-width:480px; width:100%;}
  }
</style>
</head>

/* ============ CONFIG ============ */
const CAT_COLORS = {
  "Fiesta":"var(--magenta)", "Deportivo":"var(--cyan)", "Cultural":"var(--violet)",
  "Exposición":"var(--amber)", "Gastronomía":"#ff7a45", "Concierto":"var(--green)"
};
const DAYS = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const OLD_LIMIT_DAYS = 2; // ocultar eventos con más de 2 días de antigüedad

function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(d){
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yy=d.getFullYear();
  return `${DAYS[d.getDay()]} ${dd}/${mm}/${yy}`;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

const today = new Date(); today.setHours(0,0,0,0);
const cutoff = new Date(today); cutoff.setDate(cutoff.getDate()-OLD_LIMIT_DAYS);

const events = SEED
  .map(e=>({...e, sD:parseISO(e.start), eD:parseISO(e.end)}))
  .filter(e=> e.eD >= cutoff)
  .sort((a,b)=> a.sD-b.sD);

/* ============ RENDER ============ */
const feed = document.getElementById('feed');
const filtersEl = document.getElementById('filters');
const counterEl = document.getElementById('counter');
const progressBar = document.getElementById('progressBar');

function noPhotoSVG(){
  return `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
    <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.7"/>
    <path d="M21 16.5 15.5 12 6 19"/></svg>`;
}

function cardHTML(e){
  const isRange = e.start !== e.end;
  const isToday = today >= e.sD && today <= e.eD;
  const dateLabel = isRange
    ? `${fmtDate(e.sD)} → ${fmtDate(e.eD)}`
    : fmtDate(e.sD);
  const badgeClass = isRange ? 'date-badge range' : 'date-badge';
  const color = CAT_COLORS[e.cat] || 'var(--cyan)';
  const photo = e.img
    ? `<img src="${e.img}" alt="${e.title}" loading="lazy">`
    : `<div class="no-photo">${noPhotoSVG()}<span>SIN IMAGEN</span></div>`;
  return `
  <section class="card${isToday?' today':''}" data-cat="${e.cat}">
    <div class="date-row">
      <span class="${badgeClass}">${dateLabel}</span>
      ${isToday?'<span class="today-tag">▶ HOY</span>':''}
    </div>
    <div class="photo-wrap">
      ${photo}
      <span class="cat-tag" style="background:${color}">${e.cat.toUpperCase()}</span>
    </div>
    <h2>${e.title}</h2>
    <div class="place">${e.place}</div>
    <div class="desc">${e.desc.split('\n').map(p=>`<p>${p.trim()}</p>`).join('')}</div>
  </section>`;
}

function renderFeed(list){
  if(!list.length){
    feed.innerHTML = `<div id="empty"><b>NO HAY EVENTOS</b><span>No quedan fiestas o eventos activos para este filtro en este momento.</span></div>`;
    counterEl.textContent = '0 / 0';
    progressBar.style.height='0%';
    return;
  }
  feed.innerHTML = list.map(cardHTML).join('') +
    `<div class="swipe-hint" style="position:fixed;">DESLIZA<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg></div>`;
  updateCounter(list.length);
}

function buildFilters(){
  const cats = ['Todas', ...new Set(events.map(e=>e.cat))];
  filtersEl.innerHTML = cats.map((c,i)=>`<div class="chip${i===0?' active':''}" data-cat="${c}">${c}</div>`).join('');
  filtersEl.addEventListener('click', ev=>{
    const chip = ev.target.closest('.chip'); if(!chip) return;
    filtersEl.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    const cat = chip.dataset.cat;
    const list = cat==='Todas' ? events : events.filter(e=>e.cat===cat);
    renderFeed(list);
  });
}

let currentList = events;
function updateCounter(total){
  const cards = feed.querySelectorAll('.card');
  let idx = 1;
  const scrollTop = feed.scrollTop, h = feed.clientHeight;
  cards.forEach((c,i)=>{ if(c.offsetTop <= scrollTop + h/2) idx = i+1; });
  counterEl.textContent = `${idx} / ${total}`;
  progressBar.style.height = `${(idx/total)*100}%`;
}
feed.addEventListener('scroll', ()=>{
  const total = feed.querySelectorAll('.card').length;
  if(total) updateCounter(total);
}, {passive:true});

buildFilters();
renderFeed(events);
</script>
