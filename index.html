            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, -apple-system, 'Orbitron', monospace;

            padding: 2rem 1.5rem;
        }

        /* fondo futurista con rejilla */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(#00f2ff10 1px, transparent 1px),
                linear-gradient(90deg, #00f2ff10 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* encabezado neon */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #aaffff, #3d5afe, #b14eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 8px #00ccff80, 0 0 20px #3a0ca3;
            letter-spacing: -0.5px;
            font-family: 'Orbitron', monospace;
            text-transform: uppercase;
        }

        .sub {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-top: 0.5rem;
            color: #9bb9ff;
            border-bottom: 1px solid #2affdd50;
            display: inline-block;
            padding-bottom: 0.5rem;
            backdrop-filter: blur(2px);
        }

        .glow-bar {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #00ffff, #ff44f0, #00ffff);
            margin: 1rem auto 0;
            border-radius: 4px;
            box-shadow: 0 0 12px cyan;
        }

        /* filtro y grid */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            background: rgba(12, 20, 35, 0.6);
            backdrop-filter: blur(12px);
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0f1422;
            border-radius: 40px;
            padding: 5px 18px;
            border: 1px solid #2affbb60;
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 10px 0;
            font-size: 0.9rem;
            color: #ccf5ff;
            outline: none;
            width: 220px;
            font-family: monospace;
        }

        .search-box input::placeholder {
            color: #6a85b0;
        }

        .date-sort {
            display: flex;
            gap: 12px;
        }

        .neon-btn {
            background: none;
            border: 1px solid #22ffff;
            color: #bbffff;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: monospace;
            backdrop-filter: blur(4px);
        }

        .neon-btn:hover {
            background: #00ffff20;
            box-shadow: 0 0 10px cyan;
            text-shadow: 0 0 2px cyan;
            border-color: #ff66ff;
        }

        /* grid cards futuristas */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }

        .event-card {
            background: rgba(8, 18, 28, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        .event-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 20px 35px black;
            border-color: #ff44ee80;
        }

        .event-img {
            height: 180px;
            background: #021018;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #1affd030;
        }

        .event-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .event-img .placeholder-icon {
            font-size: 3rem;
            color: #46ffdb;
            opacity: 0.5;
        }

        .event-content {
            padding: 1.3rem 1.5rem 1.5rem;
            flex: 1;
        }

        .event-title {
            font-size: 1.35rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff, #b7f0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .event-date {
            display: inline-block;
            font-family: 'Orbitron', monospace;
            background: #0a1122;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin: 0.5rem 0 0.8rem 0;
            border-left: 3px solid #00ffff;
            color: #9acdff;
        }

        .event-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #c3d6ff;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-link {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0e1a2e80;
            padding: 6px 12px;
            border-radius: 32px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 500;
            color: #8dc9ff;
            border: 1px solid #2effcc30;
            transition: 0.2s;
            width: fit-content;
        }

        .event-link:hover {
            background: #00aaff20;
            color: white;
            border-color: cyan;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-top: 2px solid cyan;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-detail {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 0.7rem;
            color: #6c9eff;
        }

        .error-badge {
            color: #ffaa88;
            font-size: 0.7rem;
            border-left: 2px solid #ff6644;
            padding-left: 8px;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            font-size: 0.7rem;
            opacity: 0.6;
            border-top: 1px dashed cyan;
        }

        @media (max-width: 720px) {
            body {
                padding: 1rem;
            }
            .header h1 {
                font-size: 2.5rem;
            }
            .filters {
                flex-direction: column;
                align-items: stretch;
                border-radius: 32px;
            }
        }
    </style>

    // Normalizar URLs (sustituir /../ por / para consistencia, pero funcionan igual)
    function normalizeUrl(url) {
        return url.replace(/\/\.\.\//g, '/');
    }

    let currentEvents = [...eventsRaw];
    let sortDirection = 'asc'; // asc por defecto

    // fecha formateada
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    // renderizado base (skeleton con loading)
    function renderEvents(eventsArray) {
        const container = document.getElementById('eventsContainer');
        if (!container) return;
        if (eventsArray.length === 0) {
            container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;">🛸 ningún evento coincide con la búsqueda</div>`;
            return;
        }
        container.innerHTML = eventsArray.map((ev, idx) => `
            <div class="event-card" data-event-idx="${idx}" data-url="${ev.url}">
                <div class="event-img" id="img-${idx}">
                    <div class="loader"></div>
                </div>
                <div class="event-content">
                    <div class="event-title">${escapeHtml(ev.name)}</div>
                    <div class="event-date">📅 ${formatDate(ev.date)}</div>
                    <div class="event-desc" id="desc-${idx}">
                        <span class="loading-detail">🔮 extrayendo información del enlace...</span>
                    </div>
                    <a class="event-link" href="${normalizeUrl(ev.url)}" target="_blank" rel="noopener noreferrer">
                        🔗 acceder a la fuente original ↗
                    </a>
                </div>
            </div>
        `).join('');
        // Lanzar fetching dinámico para cada tarjeta (imagen + descripcion)
        eventsArray.forEach((ev, i) => {
            fetchDetailsForEvent(ev, i);
        });
    }

    // Escapar HTML
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // proxy CORS + extracción de imagen y descripción
    async function fetchDetailsForEvent(event, idx) {
        const targetUrl = normalizeUrl(event.url);
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('proxy fetch fail');
            const data = await response.json();
            const htmlContent = data.contents;
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');

            // ----- IMAGEN -----
            let imgSrc = null;
            const ogImage = doc.querySelector('meta[property="og:image"]')?.getAttribute('content');
            if (ogImage && ogImage.trim()) imgSrc = ogImage;
            if (!imgSrc) {
                const twitterImage = doc.querySelector('meta[name="twitter:image"]')?.getAttribute('content');
                if (twitterImage) imgSrc = twitterImage;
            }
            if (!imgSrc) {
                const firstImg = doc.querySelector('img');
                if (firstImg && firstImg.src) imgSrc = firstImg.src;
            }
            if (imgSrc && !imgSrc.startsWith('http')) {
                try {
                    imgSrc = new URL(imgSrc, targetUrl).href;
                } catch(e) { imgSrc = null; }
            }
            const imgContainer = document.getElementById(`img-${idx}`);
            if (imgContainer && imgSrc) {
                imgContainer.innerHTML = `<img src="${imgSrc}" alt="visual del evento" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'placeholder-icon\\'>🎨</div>';">`;
            } else if (imgContainer) {
                imgContainer.innerHTML = `<div class="placeholder-icon">✨🎭</div>`;
            }

            // ----- DESCRIPCIÓN -----
            let description = '';
            const ogDesc = doc.querySelector('meta[property="og:description"]')?.getAttribute('content');
            if (ogDesc && ogDesc.trim()) description = ogDesc.trim();
            if (!description) {
                const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content');
                if (metaDesc) description = metaDesc.trim();
            }
            if (!description) {
                const firstP = doc.querySelector('p');
                if (firstP && firstP.innerText.trim()) description = firstP.innerText.trim().slice(0, 280);
            }
            if (!description) description = `📌 Información detallada disponible en el sitio oficial. Evento destacado en la agenda de Llanes.`;
            const descDiv = document.getElementById(`desc-${idx}`);
            if (descDiv) descDiv.innerHTML = escapeHtml(description.length > 260 ? description.slice(0, 260) + '…' : description);
        } catch (err) {
            console.warn(`error fetching ${event.url}`, err);
            const imgContainer = document.getElementById(`img-${idx}`);
            if (imgContainer) imgContainer.innerHTML = `<div class="placeholder-icon">🌊⚡</div>`;
            const descDiv = document.getElementById(`desc-${idx}`);
            if (descDiv) descDiv.innerHTML = `<span class="error-badge">⚠️ no se pudo cargar vista previa, pero puedes consultar el enlace original.</span>`;
        }
    }

    // ordenamiento por fecha
    function sortEventsByDate(events, direction) {
        return [...events].sort((a,b) => {
            const dateA = new Date(a.date);
            const dateB = new Date(b.date);
            if (direction === 'asc') return dateA - dateB;
            else return dateB - dateA;
        });
    }

    // filtro de búsqueda (nombre)
    let searchTerm = '';
    function filterAndRender() {
        let filtered = [...eventsRaw];
        if (searchTerm.trim() !== '') {
            const term = searchTerm.trim().toLowerCase();
            filtered = filtered.filter(ev => ev.name.toLowerCase().includes(term));
        }
        filtered = sortEventsByDate(filtered, sortDirection);
        currentEvents = filtered;
        renderEvents(currentEvents);
    }

    // eventos UI
    document.addEventListener('DOMContentLoaded', () => {
        // inicial
        sortDirection = 'asc';
        filterAndRender();

        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value;
                filterAndRender();
            });
        }
        const btnAsc = document.getElementById('sortAsc');
        const btnDesc = document.getElementById('sortDesc');
        if (btnAsc) {
            btnAsc.addEventListener('click', () => {
                sortDirection = 'asc';
                filterAndRender();
            });
        }
        if (btnDesc) {
            btnDesc.addEventListener('click', () => {
                sortDirection = 'desc';
                filterAndRender();
            });
        }
    });
</script>
</body>
